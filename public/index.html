<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concha</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('tema') === 'light' ? 'light' : 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }</script>
<style>
:root{
  /* Concha: la bahia al caer la tarde. Agua, arena y cielo */
  --bg:#0b1a23; --surface:#11242f; --raised:#183240; --line:#234656;
  --text:#e9f1f4; --muted:#8fa9b5;
  --brand:#5cc3e2; --on-brand:#05212c; --sand:#ecd29b;
  --ok:#5fcf96; --warn:#f0b545; --bad:#f0725f; --idle:#8a9a9f; --violet:#a9a6ff;
  --s1:#3987e5; --s2:#d95926;
  --r:10px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f6f8; --surface:#ffffff; --raised:#e9f0f3; --line:#d0dce2;
  --text:#11252e; --muted:#58717d;
  --brand:#0e7ea3; --on-brand:#ffffff; --sand:#b98a2b;
  --ok:#16824f; --warn:#9a6200; --bad:#c23d29; --idle:#6b7b82; --violet:#5b54c9;
  --s1:#2a78d6; --s2:#eb6834;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
h1{font-size:26px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
h2{font-size:18px;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Estructura */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 18px;font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--brand)}
.brand span{display:block;font-size:12.5px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 10px 12px;flex:1;overflow-y:auto}
.nav .h{font-size:12.5px;font-weight:600;color:var(--brand);padding:14px 12px 4px}
.nav .h.l1{padding:8px 12px 2px 22px;color:var(--muted)}
.nav button.l1{margin-left:10px}
.nav button.l1{padding-top:7px;padding-bottom:7px}
.nav button.l2{margin-left:22px;padding-top:5px;padding-bottom:5px;font-size:14px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:6px;padding:9px 12px;cursor:pointer;color:var(--muted)}
.nav button:hover{background:var(--raised);color:var(--text)}
.nav button[aria-current="page"]{background:var(--raised);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.nav .n{font-size:12px;background:var(--bg);border-radius:10px;padding:1px 8px;color:var(--muted)}
.sidefoot{padding:14px 20px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.sidefoot button{background:none;border:0;color:var(--muted);padding:0;margin-top:8px;cursor:pointer;text-decoration:underline}
main{padding:32px 36px 60px;min-width:0;max-width:1200px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{color:var(--muted);margin-top:4px;max-width:62ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* Botones y campos */
.btn{border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.danger{color:#2b0b06}
.btn.ghost{background:none}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:14px}
label.f>input,label.f>select,label.f>textarea,.inrow>input{display:block;width:100%;margin-top:5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--text)}
.inrow{display:flex;gap:8px;margin-top:5px}
.inrow>input{margin-top:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{display:flex;gap:8px;align-items:center;padding:4px 0;color:var(--text);font-size:14px}
fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 14px 12px;margin:0 0 14px}
legend{font-size:13px;color:var(--muted);padding:0 6px}
.liblist{max-height:170px;overflow:auto;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.liblist.off{opacity:.4;pointer-events:none}

/* Recorrido de una cuenta: la pieza central del resumen */
.flow{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stg{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;background:none;border:0;border-right:1px solid var(--line);padding:18px 22px 16px;cursor:pointer}
.stg:last-child{border-right:0}
.stg:hover{background:var(--raised)}
.stg b{display:block;font-size:40px;font-weight:650;line-height:1;letter-spacing:-.02em}
.stg span{display:block;margin-top:8px;font-weight:600}
.stg small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.stg::after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.stg:hover::after{background:var(--raised)}
.stg:last-child::after{display:none}
.stg.active b{color:var(--ok)} .stg.soon b{color:var(--warn)} .stg.expired b{color:var(--bad)} .stg.trash b{color:var(--idle)}
.flownote{color:var(--muted);font-size:13px;margin:10px 2px 30px}

/* Tablas y paneles */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.panel+.panel,.panel+h2,h2+.panel{margin-top:14px}
section+section{margin-top:34px}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .acts{justify-content:flex-end;flex-wrap:nowrap}
.name{font-weight:600}
.empty{padding:38px 24px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.active{color:var(--ok)} .badge.soon{color:var(--warn)} .badge.expired{color:var(--bad)} .badge.trash{color:var(--idle)}
.err{color:var(--bad);font-size:12.5px;margin-top:3px;max-width:44ch}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);border-radius:16px;padding:4px 13px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--raised);color:var(--text);border-color:var(--muted)}
.pad{padding:18px 20px}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line)}
.cal>div{background:var(--surface);min-height:92px;padding:6px 8px;font-size:12.5px;min-width:0}
.cal>.dow{min-height:0;color:var(--muted);font-weight:600;padding:8px}
.cal>.out{background:var(--bg)}
.cal .dn{color:var(--muted)}
.cal .today .dn{color:var(--brand);font-weight:700}
.cal button{display:block;width:100%;text-align:left;border:0;border-radius:4px;margin-top:3px;padding:2px 6px;font-size:12.5px;cursor:pointer;background:var(--raised);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal button.expired{box-shadow:inset 3px 0 0 var(--bad)} .cal button.soon{box-shadow:inset 3px 0 0 var(--warn)} .cal button.active{box-shadow:inset 3px 0 0 var(--ok)}

/* En directo */
.bar{height:4px;background:var(--bg);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}

/* Diálogo, avisos y acceso */
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(4,12,13,.72)}
dialog form{padding:22px 24px}
dialog h2{margin-bottom:16px}
.dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.derr{color:var(--bad);font-size:13.5px;margin-top:6px}
.preview{background:var(--bg);border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.facts{background:var(--bg);border-radius:6px;padding:6px 14px;margin:0 0 16px}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:6px;font-weight:600;max-width:90vw;z-index:50}
#toast.bad{background:var(--bad);color:#2b0b06}
#gate{min-height:100%;display:grid;place-items:center;padding:24px}
#gate form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px}
#gate .brand{padding:0 0 14px}
#gate p{color:var(--muted);margin-bottom:18px}

@media (max-width:860px){
  #app{grid-template-columns:1fr;align-content:start}
  .flow{grid-template-columns:1fr 1fr}
  .stg:nth-child(2){border-right:0}
  .stg:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .stg::after{display:none}
  .row2{grid-template-columns:1fr}
  .cal>div{min-height:64px;padding:4px}
}

/* v2: planes, creditos y usuarios */
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1180px){.row4{grid-template-columns:1fr 1fr}}
.formpage h2{margin:0 0 16px}
.formpage h2.sep{margin-top:10px;padding-top:22px;border-top:1px solid var(--line)}
.formpage textarea{resize:vertical}
.formpage .dfoot{margin-top:6px}
.contact{font-size:13px;margin-top:2px}
.contact a{color:var(--brand);text-decoration:none}
.contact a:hover{text-decoration:underline}
.due{color:var(--warn);font-size:13px;margin-top:2px}
.audit li{margin:4px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--text)}
button.tile{cursor:pointer} button.tile:hover{background:var(--raised)}
.tile b{font-size:26px;font-weight:650;line-height:1.1;letter-spacing:-.01em}
.tile b small{font-size:14px;font-weight:400;color:var(--muted)}
.tile span{font-size:13px;color:var(--muted);margin-top:3px}
.tile.mine b,.tile.demo b{color:var(--brand)} .tile.active b{color:var(--ok)} .tile.soon b{color:var(--warn)} .tile.expired b{color:var(--bad)}
.tools select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:220px}
.combo{position:relative}
.combo-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:190px;max-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left}
.combo-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-btn::after{content:"";flex-shrink:0;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.combo-pop{position:absolute;z-index:35;top:calc(100% + 4px);left:0;width:min(300px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.combo-pop input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.combo-list{max-height:min(280px,38vh);overflow:auto;display:flex;flex-direction:column;gap:1px}
.combo-list button{text-align:left;background:none;border:0;border-radius:5px;padding:8px 10px;cursor:pointer}
.combo-list button:hover{background:var(--raised)}
.combo-list button[aria-selected="true"]{background:var(--raised);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.combo-list small{color:var(--muted);font-size:12.5px;margin-left:6px}
.combo-none{padding:8px 10px;color:var(--muted);font-size:13.5px}
.dirbtn{min-width:42px}
.expcols{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.expfmt{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.expfmt:hover{background:var(--raised)} .expfmt b{display:block} .expfmt small{color:var(--muted);font-size:13px}
.expfmt:disabled{opacity:.5;cursor:default}
#printArea{display:none}
@media print{
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font:10px/1.35 "Segoe UI",system-ui,sans-serif}
  #printArea h1{font-size:16px;margin:0 0 2px;color:#000} #printArea p{margin:0 0 8px;color:#444}
  #printArea table{width:100%;border-collapse:collapse} #printArea th,#printArea td{border:1px solid #999;padding:3px 5px;text-align:left;color:#000;font-size:9.5px;overflow-wrap:anywhere}
  #printArea th{background:#e6e6e6;font-weight:700} #printArea thead{display:table-header-group} #printArea tr{break-inside:avoid}
  @page{size:landscape;margin:10mm}
}
.tabbar,#shade{display:none}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--idle);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard.active{border-left-color:var(--ok)} .ccard.soon{border-left-color:var(--warn)} .ccard.expired{border-left-color:var(--bad)} .ccard.demo{border-left-color:var(--brand)}
.ccard header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ccard .who{min-width:0} .ccard .who .name{font-size:16px;overflow-wrap:anywhere}
.ccard .hd{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ccard .kv{font-size:13.5px;color:var(--muted)} .ccard .kv span{color:var(--text)}
.ccard .more{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.ccard .more .wide{grid-column:1/-1}
.ccard .acts{margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;border:1px solid var(--line);border-radius:5px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.tag.q{color:var(--warn);border-color:rgba(240,181,69,.4)}
.tag.left{font-weight:600} .tag.left.active{color:var(--ok)} .tag.left.soon{color:var(--warn)} .tag.left.expired{color:var(--bad)} .tag.left.demo{color:var(--brand)}
.linkbtn{background:none;border:0;padding:0 0 0 6px;color:var(--brand);cursor:pointer;font-size:13px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 2px 12px;font-size:13.5px}
.pager .acts{align-items:center}
.mlist{display:flex;flex-direction:column;gap:2px;margin:-4px -8px 0}
.mitem{text-align:left;background:none;border:0;border-radius:6px;padding:10px 12px;cursor:pointer}
.mitem:hover{background:var(--raised)} .mitem.sep{border-top:1px solid var(--line);border-radius:0 0 6px 6px;margin-top:4px}
.mitem.bad{color:var(--bad)} .mitem small{display:block;color:var(--muted);font-size:12.5px}
.bulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--raised);border:1px solid var(--brand);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.bulk b{margin-right:auto}
.selall{display:inline-flex;align-items:center;gap:8px;font-size:14px;margin:0 2px 12px;cursor:pointer}
.ccard .pick{width:18px;height:18px;margin:3px 2px 0 0;flex-shrink:0}
.ccard.picked{outline:2px solid var(--brand);outline-offset:-1px}
.vcards{display:flex;flex-direction:column;gap:10px}
.vcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:var(--r);padding:12px 16px}
.vcard.r-super,.vcard.r-admin{border-left-color:var(--violet)} .vcard.r-reseller{border-left-color:var(--ok)} .vcard.r-sub{border-left-color:var(--warn)}
.vcard.off{opacity:.65}
.vcard .vmain{flex:1;min-width:220px;display:flex;flex-direction:column;gap:5px}
.vcard .vrole{font-size:12.5px;font-weight:600}
.vcard.r-super .vrole,.vcard.r-admin .vrole{color:var(--violet)} .vcard.r-reseller .vrole{color:var(--ok)} .vcard.r-sub .vrole{color:var(--warn)}
.tag.cr{color:var(--ok);border-color:rgba(95,207,150,.4);font-weight:600} .tag.eur{color:var(--brand);border-color:rgba(69,196,209,.4)}
.kind{display:inline-block;font-size:12.5px;font-weight:600;border-radius:5px;padding:1px 8px;border:1px solid var(--line)}
.kind.credito{color:var(--ok)} .kind.asignacion{color:var(--violet)} .kind.renovacion,.kind.alta{color:var(--brand)} .kind.ajuste{color:var(--warn)}
.packrow{display:grid;grid-template-columns:1fr 130px;gap:10px;margin-bottom:8px}
.packrow input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.module{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:16px}
.module .state{font-weight:700;font-size:13px;border-radius:5px;padding:3px 10px;border:1px solid var(--line);color:var(--muted)}
.module .state.on{color:var(--ok);border-color:rgba(95,207,150,.5)}
.module .grow{flex:1;min-width:200px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px;margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--text);font-weight:600}
tr.unread td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.lvl{font-size:12.5px;font-weight:600;color:var(--bad)}
.hist{max-height:55vh;overflow:auto;margin:0;padding:0;list-style:none}
.hist li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px} .hist li:last-child{border-bottom:0}
.badge.demo{color:var(--brand)}
.cal button.demo{box-shadow:inset 3px 0 0 var(--brand)}
.sidefoot b{color:var(--text)}
.plus{color:var(--ok);font-weight:600} .minus{color:var(--bad);font-weight:600}
.bal{display:flex;align-items:baseline;gap:12px}
.bal b{font-size:56px;font-weight:650;line-height:1;letter-spacing:-.02em;color:var(--brand)}
.bal span{color:var(--muted)}
table.prices{width:auto}
table.prices th,table.prices td{padding:5px 14px 5px 0;border:0;font-size:13.5px}
table.prices input{width:92px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
@media (max-width:860px){.row3,.row4{grid-template-columns:1fr}}

/* ---------- Monitor ---------- */
.mon-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mon-clock{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 10px}
.mon-clock select{width:auto;padding:6px 8px;min-height:0}
.mon-clock .left{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:44px}
.mon-auto{border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;background:var(--raised);color:var(--muted)}
.mon-auto[aria-pressed=true]{background:linear-gradient(135deg,#19c37d,#0ea5a4);color:#fff}
.mk{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin:4px 0 14px}
.mk button{--c:#3fa9f5;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px 11px;border-radius:14px;cursor:pointer;color:var(--text);
  border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--c) 20%,var(--surface)),var(--surface) 75%)}
.mk button::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c)}
.mk button[aria-pressed=true]{box-shadow:0 0 0 2px var(--c) inset}
.mk .ic{color:var(--c);width:20px;height:20px}
.mk b{font-size:22px;line-height:1.1;color:var(--c);font-variant-numeric:tabular-nums}
.mk b small{font-size:12px}
.mk span{font-size:11.5px;color:var(--muted);text-align:center}
.msrv{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.msrv button{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.msrv button[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.msrv i{width:8px;height:8px;border-radius:50%;background:#34c98a;box-shadow:0 0 0 3px color-mix(in srgb,#34c98a 25%,transparent)}
.msrv i.off{background:#f0616d;box-shadow:0 0 0 3px color-mix(in srgb,#f0616d 25%,transparent)}
.msrv em{font-style:normal;font-weight:700;color:var(--c)}
.mfil{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:14px}
.mfil label:first-child{grid-column:span 2}
.mfil label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.mfil input,.mfil select,.mon-clock select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;width:100%;min-width:0}
.mon-clock select{border-radius:8px;padding:6px 8px;background:var(--bg)}
.mfil input:focus,.mfil select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mc{--c:#3fa9f5;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;transition:transform .15s}
.mc:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.mc .pst{position:relative;aspect-ratio:2/3;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 55%,#0b1a2a),#101826);display:grid;place-items:center;overflow:hidden}

.mc .who div{min-width:0} .mc .who b,.mc .who small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .mc .who small{color:var(--muted);font-size:11.5px}
.mc .q{display:flex;flex-wrap:wrap;gap:4px}

.mc .ln{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:12px} .mc .ln b{color:var(--text);font-variant-numeric:tabular-nums}

.mc .ft{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:6px}

.mc .ft button .ic{width:15px;height:15px}

.mc .ft button.x:hover{background:#f0616d;color:#fff}
.mc .ft button.m:hover{background:#3fa9f5;color:#fff}
.mtpl{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.mtpl button{font-size:12px;border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:999px;padding:5px 10px;cursor:pointer}
.mtpl button:hover{border-color:var(--brand)}
@media (max-width:1180px){.mk{grid-template-columns:repeat(4,1fr)}}
.mc .pill .s{display:none}
@media (max-width:640px){
  .mk{grid-template-columns:repeat(4,1fr);gap:7px} .mk button{padding:9px 3px 8px;border-radius:12px} .mk b{font-size:17px} .mk span{font-size:10px} .mk .ic{width:16px;height:16px}
  .mfil{grid-template-columns:1fr 1fr;gap:7px} .mfil label:first-child{grid-column:1/-1} .mfil label span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} .mfil select,.mfil input{padding:8px 10px;font-size:13.5px}

<body>

<div id="gate" hidden>
  <div class="gbg" aria-hidden="true">

<script>
'use strict';

/** Columnas apiladas: altas y renovaciones de cada uno de los ultimos 30 dias */
function activityChart(days) {
  if (!days.length) return '';
  // el ancho se toma del hueco real para que el texto no se agrande ni se encoja
  const W = Math.max(280, Math.min(1100, (($('#main') || {}).clientWidth || 760) - ((window.innerWidth || 1200) <= 860 ? 70 : 114))), H = W < 480 ? 160 : 200, L = 28, R = 6, T = 8, B = 22, pw = W - L - R, ph = H - T - B;
  const max = Math.max(1, ...days.map((d) => d.alta + d.renovacion));
  const step = Math.max(1, Math.ceil(max / 3)), top = step * Math.ceil(max / step);
  const y = (v) => T + ph - (v / top) * ph, band = pw / days.length, bw = Math.max(3, Math.min(24, band - (band < 14 ? 3 : 6))), every = W < 480 ? 10 : 5;
  const lab = (d) => { const [, m, dd] = d.split('-').map(Number); return `${dd} ${MES[m - 1]}`; };
  const seg = (x, v0, v1, cls, cap) => {
    const y1 = y(v1), y0 = y(v0) - (v0 > 0 ? 2 : 0), h = y0 - y1;
    if (h <= 0) return '';
    const r = cap ? Math.min(4, h, bw / 2) : 0;
    return `<path class="${cls}" d="M${x} ${y0}V${y1 + r}q0-${r} ${r}-${r}h${bw - 2 * r}q${r} 0 ${r} ${r}V${y0}z"/>`;
  };
  let grid = '', bars = '', hits = '', xl = '';
  for (let v = 0; v <= top; v += step) grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  days.forEach((d, k) => {
    const x = L + k * band + (band - bw) / 2, tot = d.alta + d.renovacion;
    bars += seg(x, 0, d.alta, 'a', !d.renovacion) + seg(x, d.alta, tot, 'b', true);
    hits += `<rect class="hit" tabindex="0" x="${L + k * band}" y="${T}" width="${band}" height="${ph}" data-tip="${lab(d.d)}|${d.alta}|${d.renovacion}" aria-label="${lab(d.d)}: ${plural(d.alta, 'alta', 'altas')}, ${plural(d.renovacion, 'renovación', 'renovaciones')}"/>`;
    if (k % every === every - 1) xl += `<text class="axis" x="${L + k * band + band / 2}" y="${H - 5}" text-anchor="middle">${lab(d.d)}</text>`;
  });
  const total = days.reduce((n, d) => n + d.alta + d.renovacion, 0);
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Cuentas nuevas</span><span><i style="background:var(--s2)"></i>Renovaciones</span><span style="margin-left:auto">Últimos 30 días${total ? '' : ': todavía sin altas ni renovaciones'}</span></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Cuentas nuevas y renovaciones por día, últimos 30 días">${grid}${bars}${xl}${hits}</svg><div class="tip" hidden></div></div>
    <details class="tbl"><summary>Ver como tabla</summary><table><thead><tr><th>Día</th><th>Cuentas nuevas</th><th>Renovaciones</th></tr></thead><tbody>${[...days].reverse().filter((d) => d.alta + d.renovacion).map((d) => `<tr><td>${lab(d.d)}</td><td>${d.alta}</td><td>${d.renovacion}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Sin actividad en estos 30 días.</td></tr>'}</tbody></table></details>`;
}

/** Comparador de la lista de clientes: los que no tienen dato van siempre al final */
function clientSorter() {
  const key = {
    name: (c) => c.panelName.toLowerCase(), email: (c) => (c.email || '').toLowerCase(), server: (c) => serverName(c.serverId).toLowerCase(),
    quality: (c) => (c.quality ? Q[c.quality] : '') + (c.screens || 0), owner: (c) => (userName(c.ownerId) || '').toLowerCase(),
    expiry: (c) => c.expiresAt || c.expires, seen: (c) => (S.seen && S.seen[c.id] && !String(S.seen[c.id]).startsWith('0001') ? S.seen[c.id] : ''),
    action: (c) => c.lastAction || c.createdAt || '', created: (c) => (c.createdAt || '') + String(c.id).padStart(9, '0'),
  }[S.sort] || ((c) => c.expires);
  return (x, y) => {
    const a = key(x), b = key(y);

function auditHtml() {

  const ok = a.checked - a.notInEmby.length - a.mismatch.length;
  h += `<div class="ktiles">${tile(ok, 'cuentas que cuadran', '#19c37d', 'check')}${tile(a.notInPanel.length, 'en Emby pero no en el panel', '#f0616d', 'alert', 'se han quedado sin eliminar o se crearon a mano')}${tile(a.notInEmby.length, 'en el panel pero ya no en Emby', '#f59e0b', 'trash')}${tile(a.mismatch.length, 'con diferencias', '#a46bff', 'wrench')}</div>`;

  if (!a.notInPanel.length && !a.notInEmby.length && !a.mismatch.length) {

    h += `<section class="au-sec au-red"><div class="sec-h"><h2>En Emby, pero fuera del panel (${a.notInPanel.length})</h2></div>
      <p class="muted small">Usuarios de Emby que el panel no controla: no caducan ni gastan créditos. Suelen ser cuentas que se quedaron sin eliminar o que alguien creó a mano en Emby. Los administradores de Emby no salen aquí y nunca se tocan.</p>
      <div class="au-bar">${all('emby', keys)}<span class="sp"></span>
        <button class="btn sm" data-act="au-emby" data-do="disable"${n ? '' : ' disabled'}>${ic('power')}Desactivar${n ? ` (${n})` : ''}</button>
        <button class="btn sm danger" data-act="au-emby" data-do="delete"${n ? '' : ' disabled'}>${ic('trash')}Eliminar de Emby${n ? ` (${n})` : ''}</button>
        <button class="btn sm" data-act="import">${ic('download')}Pasarlas al panel</button></div>
      <div class="panel"><table class="cards"><thead><tr><th></th><th>Usuario de Emby</th><th>Estado en Emby</th><th>Última conexión</th></tr></thead><tbody>${a.notInPanel.map((r) => `<tr>

        <td><div class="name">${esc(r.name)}</div>${multi ? `<div class="small muted">${esc(r.server)}</div>` : ''}${r.created ? `<div class="small muted">Creado el ${fmtTs(r.created, true)}</div>` : ''}</td>

  }

      <p class="muted small">Ya no existen en el servidor (alguien las borró en Emby). Quítalas del panel para que no cuenten.</p>
      <div class="au-bar">${all('gone', keys)}<span class="sp"></span><button class="btn sm danger" data-act="au-forget"${n ? '' : ' disabled'}>${ic('trash')}Quitar del panel${n ? ` (${n})` : ''}</button></div>

        <td style="width:34px">${cb('mis', String(r.id), r.panelName)}</td><td><div class="name">${esc(r.panelName)}</div><div class="small muted">${esc(r.embyName)}${multi ? ', ' + esc(r.server) : ''}${r.owner ? ', de ' + esc(r.owner) : ''}</div></td>
        <td><ul class="au-pr">${r.problems.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></td><td class="r"><button class="btn sm" data-act="m-repair" data-id="${r.id}">Reparar</button></td></tr>`).join('')}</tbody></table></div></section>`;
  }
  return h + `<p class="muted small">Comprobado ${fmtTs(a.at || new Date().toISOString(), true)} · ${plural(a.checked, 'cuenta del panel revisada', 'cuentas del panel revisadas')}.</p>`;
}
async function loadAudit() {

/* ---------- Monitor: control de inactivos ---------- */
function vInactivos() {
  const sub = 'Clientes con cuenta activa que llevan días sin ver nada. Útil para avisarles o decidir si renuevas.';
  if (!S.d.servers.length) return head('Inactivos', sub) + noServer();
  if (!S.seen) return head('Inactivos', sub) + '<div class="panel"><div class="empty">Consultando Emby…</div></div>';
  const days = S.inDays || 7, now = Date.now();
  const rows = live().filter((c) => !c.demo && ['active', 'soon'].includes(stage(c))).map((c) => {
    const v = S.seen ? seenDate(S.seen[c.id]) : null;
    return { c, d: v, ago: v ? Math.floor((now - v) / 86400000) : Infinity };
  }).filter((r) => r.ago >= days).sort((a, b) => b.ago - a.ago || a.c.panelName.localeCompare(b.c.panelName));
  const never = rows.filter((r) => r.ago === Infinity).length;
  const chip = (n) => `<button type="button" class="chip${days === n ? ' on' : ''}" data-act="in-days" data-k="${n}">${n === 1 ? '1 día' : n + ' días'}</button>`;
  const tile = (n, label, c) => `<div class="itile" style="--c:${c}"><b>${n}</b><span>${label}</span></div>`;
  return head('Inactivos', sub, '<button class="btn" data-act="in-reload">Actualizar</button>') + `
    <div class="itiles">${tile(rows.length, `sin ver nada en ${days} días o más`, '#f59e0b')}${tile(never, 'no se han conectado nunca', '#f0616d')}${tile(live().filter((c) => !c.demo && ['active', 'soon'].includes(stage(c))).length - rows.length, 'activos de verdad', '#10b981')}</div>
    <div class="tools"><span class="muted small">Sin conectarse desde hace:</span>${[3, 7, 15, 30, 60].map(chip).join('')}</div>
    ${!S.seen ? '<div class="panel"><div class="empty">Consultando Emby…</div></div>' : rows.length ? `<div class="panel"><table class="cards"><thead><tr><th>Cliente</th><th>Última conexión</th><th>Vence</th><th class="r">Acciones</th></tr></thead><tbody>${rows.map(({ c, d, ago }) => `<tr>
      <td><div class="name">${esc(c.panelName)}</div><div class="small muted">${esc(c.embyName)}${S.d.servers.length > 1 ? ', en ' + esc(serverName(c.serverId)) : ''}${S.d.users.length > 1 && c.ownerId !== me().id ? ', de ' + esc(userName(c.ownerId)) : ''}</div>${contactHtml(c)}</td>
      <td><span class="ago ${ago === Infinity ? 'never' : ago > 30 ? 'old' : 'mid'}">${ago === Infinity ? 'Nunca' : `hace ${ago} días`}</span>${d ? `<div class="small muted">${fmtTs(d.toISOString(), true)}</div>` : ''}</td>
      <td>${fmt(c.expires)}<div class="small muted">${when(c)}</div></td>
      <td class="r"><div class="acts"><button class="btn sm" data-act="msg" data-id="${c.id}">Mensaje</button><button class="btn sm ghost" data-act="edit" data-id="${c.id}">Ver ficha</button></div></td></tr>`).join('')}</tbody></table></div>`
      : `<div class="panel"><div class="empty">¡Bien! Todos tus clientes activos se han conectado en los últimos ${days} días.</div></div>`}`;
}

/* ---------- Gráficas sencillas ---------- */
const hrs = (m) => (m >= 600 ? Math.round(m / 60) + ' h' : m >= 60 ? (m / 60).toFixed(1).replace('.', ',') + ' h' : Math.round(m) + ' min');
/** Columnas: [{label, v, tip}] */
function colChart(items, color, every = 1) {
  const max = Math.max(1, ...items.map((x) => x.v));
  return `<div class="cchart" style="--c:${color}">${items.map((x, i) => `<div class="cc" title="${esc(x.tip || x.label + ': ' + x.v)}"><i style="height:${Math.max(x.v ? 3 : 0, (x.v / max) * 100)}%"></i><span>${i % every === 0 ? esc(x.label) : ''}</span></div>`).join('')}</div>`;
}
/** Barras tumbadas para rankings: [{label, sub, v, txt}] */
function rankBars(items, color) {
  const max = Math.max(1, ...items.map((x) => x.v));
  return `<div class="rbars">${items.map((x, i) => `<div class="rb" style="--c:${Array.isArray(color) ? color[i % color.length] : color}"><span class="rn">${i + 1}</span><div class="rt"><div class="rl"><b>${esc(x.label)}</b>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}<em>${esc(x.txt)}</em></div><div class="rbar"><i style="width:${(x.v / max) * 100}%"></i></div></div></div>`).join('')}</div>`;
}

async function downloadBackup(name, password) {

  const l = Object.assign(document.createElement('a'), { href: URL.createObjectURL(await r.blob()), download: fn });
  document.body.appendChild(l); l.click(); l.remove();
}

function sfReset(id) { clearTimeout(S.sf.timer); S.sf = { id, tab: S.sf.id === id ? S.sf.tab : 'cfg', data: null, busy: false, at: 0, users: null, job: null, timer: null }; }
async function sfLoad(quiet) {
  const f = S.sf, id = f.id;
  if (f.busy) return;
  f.busy = true; if (!quiet) { f.data = null; if (S.view === 'srvficha') render(); }
  try {
    const [det, job] = await Promise.all([api('GET', `/api/servers/${id}/details`, null, { timeout: 40000 }), api('GET', `/api/servers/${id}/reimport`).catch(() => ({ job: null }))]);
    if (S.sf.id !== id) return;

  } catch (e) { if (S.sf.id === id) f.data = { error: e.message, libraries: [] }; }
  finally { f.busy = false; }
  if (S.view === 'srvficha' && S.sf.id === id) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}

function sfAcc(s) {

async function impParse() {
  const f = $('#impForm'), file = f.elements.file.files[0], imp = S.imp;
  imp.serverId = +f.elements.serverId.value || 0; imp.ownerId = +(f.elements.ownerId ? f.elements.ownerId.value : 0) || 0; imp.create = f.elements.create.checked; imp.fixOwner = !!(f.elements.fixOwner && f.elements.fixOwner.checked); imp.screens = +(f.elements.screens ? f.elements.screens.value : 1) || 1;
  try {
    let table;
    if (file) {
      if (/\.xls$/i.test(file.name)) throw new Error('El formato .xls antiguo no se puede leer. Ábrelo en Excel y guárdalo como .xlsx o como CSV.');
      if (file.size > 8e6) throw new Error('El archivo pesa demasiado (máximo 8 MB).');
      table = /\.xlsx$/i.test(file.name) ? await impXlsx(await file.arrayBuffer()) : null;
      if (!table) { const t = await file.text(); table = /insert\s+into/i.test(t) ? impSql(t) : impCsv(t); }
    } else {
      const t = f.elements.text.value;
      if (!t.trim()) throw new Error('Sube un archivo o pega los datos.');
      table = /insert\s+into/i.test(t) ? impSql(t) : impCsv(t);
    }
    if (table.length < 2) throw new Error('No hay filas de datos. La primera línea debe ser la de los nombres de las columnas.');
    const keys = table[0].map(impKey);
    if (!keys.includes('username')) throw new Error('Falta la columna del usuario de Emby. Llámala «username» o «usuario». Columnas encontradas: ' + table[0].join(', '));
    if (!keys.includes('expires')) throw new Error('Falta la columna de vencimiento. Llámala «expiration» o «vencimiento». Columnas encontradas: ' + table[0].join(', '));
    const rows = table.slice(1).map((r) => { const o = {}; keys.forEach((k, i) => { if (k && o[k] === undefined) o[k] = String(r[i] ?? '').trim(); }); o.rawExpires = o.expires; o.expires = impDate(o.expires); o.start = impDate(o.start); return o; }).filter((o) => o.username);
    if (rows.length > 5000) throw new Error(`Son ${rows.length} filas. Importa como mucho 5000 cada vez: separa el archivo por vendedor.`);
    imp.rows = rows; imp.map = impMapBuild(rows); imp.cols = [...new Set(keys.filter(Boolean))]; imp.unknown = table[0].filter((h, i) => !keys[i] && String(h).trim()); imp.results = null; imp.dry = null; imp.progress = null;
    render(); window.scrollTo(0, 0);
  } catch (x) { toast(x.message, true); }
}
async function impRun(dry) {
  const imp = S.imp;
  if (imp.busy) return;
  const miss = impMissing();
  if (miss) { toast(`Te ${miss === 1 ? 'falta 1 valor' : `faltan ${miss} valores`} por elegir en «Traduce los datos del otro panel».`, true); const b = document.querySelector('.impmap-r.need select'); if (b) { b.scrollIntoView({ block: 'center' }); b.focus(); } return; }
  if (!dry) impMapSave();
  imp.busy = true; imp.results = []; imp.dry = dry; imp.progress = 0; render();
  try {
    for (let i = 0; i < imp.rows.length; i += 25) {
      const part = imp.rows.slice(i, i + 25).map(({ rawExpires, ...r }) => impMapRow(r));
      const r = await api('POST', '/api/import/rows', { rows: part, serverId: imp.serverId || undefined, ownerId: imp.ownerId || undefined, create: imp.create, fixOwner: imp.fixOwner, dry });
      r.results.forEach((x) => imp.results.push({ ...x, i: x.i + i }));
      imp.progress = Math.min(imp.rows.length, i + 25);
      if (S.view === 'importar') render();
    }
    imp.busy = false;
    if (!dry) { await reload(); S.logs = null; }
    const ok = imp.results.filter((x) => x.status === 'ok').length;
    toast(dry ? `Comprobación terminada: ${ok} de ${imp.rows.length} se pueden importar` : plural(ok, 'cuenta importada', 'cuentas importadas'));
  } catch (x) { imp.busy = false; toast(x.message, true); }
  if (S.view === 'importar') render();
}

/* ---------- Historial de conexiones de un cliente ---------- */
const DIA_L = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
function dayLabel(d) { const ago = seenAgo(d); return ago <= 0 ? 'Hoy' : ago === 1 ? 'Ayer' : `${DIA_L[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`; }
function durTxt(ms) { const m = Math.max(1, Math.round(ms / 60000)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`; }
async function dConn(c) {
  let r; try { r = await api('GET', `/api/clients/${c.id}/connections`); } catch (e) { return toast(e.message, true); }
  const w = r.week, groups = new Map();
  for (const x of r.rows.slice(0, 120)) { const d = new Date(x.from), k = d.toDateString(); if (!groups.has(k)) groups.set(k, { d, rows: [] }); groups.get(k).rows.push(x); }
  const stat = (n, label) => `<div class="cs"><b>${n}</b><span>${label}</span></div>`;
  const body = `<div class="cstats">${stat(w.devices, w.devices === 1 ? 'aparato' : 'aparatos')}${stat(w.places, w.places === 1 ? 'sitio' : 'sitios')}${stat(w.maxAt, 'a la vez (máx.)')}${stat(c.screens || '∞', 'pantallas contratadas')}</div>
    <p class="small muted" style="margin:-4px 0 12px">Últimos 7 días. «Sitio» es la zona de la conexión (casa, trabajo, datos del móvil…).</p>
    ${w.reasons.length ? `<p class="cwarn">${ic('alert')}Parece compartida: ${esc(w.reasons.join(', '))}.</p>` : ''}
    ${groups.size ? `<div class="ctl">${[...groups.values()].map((g) => `<div class="cday"><h4>${dayLabel(g.d)}</h4>${g.rows.map((x) => `<div class="crow"><i class="${x.playing ? 'pl' : ''}" title="${x.playing ? 'Vio contenido' : 'Solo navegó'}"></i><span class="ct">${hhmm(new Date(x.from))} – ${hhmm(new Date(x.to))}</span><span class="cd"><b>${esc(x.dev)}</b>${x.app ? ' · ' + esc(x.app) : ''}</span><span class="ci">${x.ip ? 'IP ' + esc(x.ip) : ''} · ${durTxt(Date.parse(x.to) - Date.parse(x.from) + 60000)}</span></div>`).join('')}</div>`).join('')}</div>`
      : '<div class="empty" style="padding:20px 0">Todavía no hay conexiones apuntadas. El panel las va guardando desde esta versión, cada vez que el cliente usa Emby.</div>'}`;
  showDlg(`Conexiones de ${c.panelName}`, body);
}

const agLvl = (v, warn = 70, bad = 90) => (v >= bad ? 'bad' : v >= warn ? 'warn' : 'ok');
const agBytes = (b) => { const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return `${b >= 100 || i === 0 ? Math.round(b) : Math.round(b * 10) / 10} ${u[i]}`; };
const agAgo = (iso) => { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? 'hace un momento' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} días`; };
const agUptime = (s) => { const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600); return d ? `${plural(d, 'día', 'días')}${h ? ' y ' + plural(h, 'hora', 'horas') : ''}` : plural(h, 'hora', 'horas'); };
function agRing(v, label, sub, lvl) {
  const r = 34, C = 2 * Math.PI * r, p = Math.max(0, Math.min(100, v));
  return `<div class="agg ${lvl}"><svg viewBox="0 0 84 84" aria-hidden="true"><circle r="${r}" cx="42" cy="42" fill="none" stroke="var(--raised)" stroke-width="9"/><circle r="${r}" cx="42" cy="42" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(p / 100) * C} ${C}" transform="rotate(-90 42 42)"/></svg><b>${Math.round(p)}<small>%</small></b><span>${label}</span><em>${sub}</em></div>`;
}
function agChart(hist, keys, title, unit, max) {
  if (hist.length < 2) return `<div class="agc"><h4>${title}</h4><p class="muted small">Las gráficas aparecen cuando haya datos de un rato.</p></div>`;
  const W = 520, H = 120, top = max || Math.max(1, ...hist.flatMap((h) => keys.map(([k]) => h[k] || 0))) * 1.15;
  const x = (i) => (i / (hist.length - 1)) * W, y = (v) => H - 4 - (Math.min(v, top) / top) * (H - 10);
  const lines = keys.map(([k, col]) => `<polyline points="${hist.map((h, i) => `${x(i).toFixed(1)},${y(h[k] || 0).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join('');
  const t0 = new Date(hist[0].at), t1 = new Date(hist[hist.length - 1].at), hh = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return `<div class="agc"><div class="agc-h"><h4>${title}</h4><div class="legend">${keys.map(([k, col, t]) => `<span><i style="background:${col}"></i>${t}</span>`).join('')}</div></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="agsvg" role="img" aria-label="${title}"><line x1="0" x2="${W}" y1="${y(top / 2)}" y2="${y(top / 2)}" class="grid"/>${lines}</svg>
    <div class="agc-x"><span>${hh(t0)}</span><span>máx. ${Math.round(top / 1.15 * 10) / 10}${unit}</span><span>${hh(t1)}</span></div></div>`;
}

      </div>

      ${disk.length > 1 ? `<div class="ag-disks">${disk.map((x) => { const p = Math.round((x.used / x.size) * 100); return `<div><span>${esc(x.mount)}</span><i><b class="${agLvl(p, 80, 90)}" style="width:${p}%"></b></i><em>${p}% · ${agBytes(x.size - x.used)} libres de ${agBytes(x.size)}</em></div>`; }).join('')}</div>` : ''}
      <details class="ag-more"><summary>Gráficas de las últimas 24 horas</summary><div class="ag-charts">

const ACC_KIND = { entrada: 'Entrada', fallido: 'Contraseña incorrecta', fallido2fa: 'Código de verificación incorrecto', bloqueado: 'Intento con el acceso desactivado', salida: 'Salida' };

function accRows() {
  const f = S.acc, d = f.data; if (!d) return [];
  // IP nueva: la primera vez que ese usuario entra desde esa IP
  const seenIp = new Map();
  for (let i = d.access.length - 1; i >= 0; i--) {
    const e = d.access[i]; if (e.kind !== 'entrada' || !e.userId) continue;
    const set = seenIp.get(e.userId) || new Set();
    e.newIp = set.size > 0 && !set.has(e.ip); set.add(e.ip); seenIp.set(e.userId, set);
  }
  const lim = { d1: 1, d7: 7, d30: 30 }[f.period], q = f.q.trim().toLowerCase();
  return d.access.filter((e) => (!f.user || String(e.userId) === f.user || (f.user === 'x' && !e.userId)) && (f.kind === 'all' || (f.kind === 'fail' ? /fallido|bloqueado/.test(e.kind) : e.kind === f.kind))
    && (!lim || Date.now() - Date.parse(e.ts) < lim * 86400000) && (!q || `${e.ip} ${e.dev} ${e.user} ${e.name}`.toLowerCase().includes(q)));
}

  const fails = d.access.filter((e) => /fallido|bloqueado/.test(e.kind) && Date.now() - Date.parse(e.ts) < 7 * 86400000).length;

/** Mantiene al dia la linea de coste y bloquea el boton si no llegan los creditos o falta configurar el contenido */
function wireCost(serverId, extra, form) {
  const f = form || dlgForm, btn = $('button[type=submit]', f);
  const upd = () => {
    const sid = +(f.elements.serverId ? f.elements.serverId.value : serverId);
    const srv = S.d.servers.find((x) => x.id === sid);
    const q = f.elements.quality.value;
    const lines = [];
    let ok = true;
    if (extra) lines.push(extra());
    if (f.elements.months) {
      const cost = priceOf(+f.elements.months.value, +f.elements.screens.value);
      if (!pays()) lines.push(`<span class="muted small">Valor: ${plural(cost, 'crédito', 'créditos')}. Como administrador no se te descuentan.</span>`);
      else if (cost > me().credits) { ok = false; lines.push(`<span class="err" style="max-width:none">Cuesta ${plural(cost, 'crédito', 'créditos')} y tienes ${me().credits}. Pide una recarga antes de continuar.</span>`); }
      else lines.push(`Cuesta <b>${plural(cost, 'crédito', 'créditos')}</b>. <span class="muted small">Tienes ${me().credits}, te quedarán ${me().credits - cost}.</span>`);
    } else lines.push('Las demos son gratis. <span class="muted small">Al terminar se desactiva sola; puedes convertirla en cuenta cuando quieras.</span>');
    if (q !== 'custom' && srv && !srv.ready[q]) { ok = false; lines.push(`<span class="err" style="max-width:none">El contenido ${Q[q]} aún no está configurado en este servidor${canDo('packages') ? ' (Servidores, Contenido)' : '. Avisa al superadministrador'}.</span>`); }
    $('#cost', f).innerHTML = lines.join('<br>');
    btn.disabled = !ok;
  };
  f.onchange = upd; upd();
}

function genPassword() {
  const abc = 'abcdefghjkmnpqrstuvwxyz23456789';

}

/** Llama a una ruta en bloque en tandas de 500 y junta los resultados */
async function bulkCall(url, ids, extra) {
  const out = { moved: 0, skipped: 0, failed: [] };
  for (let k = 0; k < ids.length; k += 500) {
    const r = await api('POST', url, { ids: ids.slice(k, k + 500), ...extra });
    out.moved += r.moved; out.skipped += r.skipped; out.failed.push(...r.failed);
  }
  return out;
}
function bulkResult(r, what, one = 'cuenta transferida', many = 'cuentas transferidas', skipTxt = 'ya estaban ahí') {

  setTimeout(() => showDlg(`${what}: ${r.moved} hechas, ${r.failed.length} sin hacer`, `<p class="muted small" style="margin-bottom:10px">Estas cuentas se han quedado como estaban:</p><ul class="hist">${r.failed.map((f) => `<li><span class="name">${esc(f.name)}</span> <span class="muted small">${esc(f.emby)}</span><div class="small err" style="max-width:none">${esc(f.error)}</div></li>`).join('')}</ul>`), 50);
  return '';
}

function fxNew(c, f) {
  if (f.mode === 'set') return f.date || c.expires;
  const n = (f.mode === 'sub' ? -1 : 1) * (Math.abs(parseInt(f.amount, 10)) || 0);
  if (!n) return c.expires;
  return f.unit === 'm' ? addMonths(c.expires, n) : addDays(c.expires, f.unit === 'w' ? n * 7 : n);
}
function fxRows() {
  const f = fxState(), t = S.d.today, q = f.search.trim().toLowerCase();
  return S.d.clients.filter((c) => {
    if (c.demo || c.status === 'trash') return false;
    if (f.only) return f.only.has(c.id); // cuentas marcadas en la lista
    const st = stage(c);
    if (!f.st.has(st)) return false;
    if (f.exOff && c.off) return false;
    if (f.owner && c.ownerId !== f.owner && (S.d.users.find((u) => u.id === c.ownerId) || {}).parentId !== f.owner) return false; // el vendedor y sus subresellers
    if (f.server && c.serverId !== f.server) return false;
    if (f.q !== 'all' && c.quality !== f.q) return false;
    if (f.from && c.expires < f.from) return false;
    if (f.to && c.expires > f.to) return false;
    if (f.within !== '' && !(diff(c.expires, t) < +f.within)) return false;
    if (q && ![c.panelName, c.embyName, c.email, c.whatsapp].some((v) => String(v || '').toLowerCase().includes(q))) return false;
    return true;
  }).sort(byExpiry).map((c) => {

async function copyText(text, el) {

  catch (e) { el.focus(); el.select(); if (!document.execCommand('copy')) throw new Error('No se pudo copiar solo. El texto está seleccionado: cópialo a mano.'); }
}

      <h3>¿Cada cuánto, esos días?</h3><p class="muted small">Solo sale mientras el cliente está viendo algo en Emby.</p>
      <label class="f" style="max-width:320px"><select name="every">${options(TV_EVERY_OPTS, cfg.every || 24)}</select></label>
      <h3>Mensaje</h3>
      <label class="f"><textarea name="message" rows="3" maxlength="300">${esc(cfg.message || '')}</textarea></label>
      <p class="muted small" style="margin-top:-6px">Puedes usar {nombre}, {cuando} (hoy, mañana, en 3 días), {dias} y {vence}.</p>
      <div class="tv-prev"><div class="tv-screen"><div class="tv-toast"><b>${esc(S.d.settings.brand.name || 'Aviso')}</b><span id="tvPrev"></span></div></div><small class="muted">Así lo verá el cliente en la tele (aparece unos segundos y se va solo; la película sigue).</small></div>
    </fieldset>`;
  return head('Aviso en la tele', 'Un mensaje que aparece en la pantalla del cliente mientras ve Emby, para recordarle que su cuenta va a caducar. Muy útil con los clientes que no usan Telegram.') + scopeTabs + `

function dServer(s) {
  openDlg({
    title: s ? `Editar ${s.name}` : 'Conectar servidor Emby', submit: s ? 'Guardar y probar' : 'Conectar',
    body: `<label class="f">Nombre<input name="name" required maxlength="60" value="${esc(s ? s.name : 'Emby')}"></label>
      <label class="f">Dirección para el panel<input name="url" required placeholder="http://192.168.0.29:8096" value="${esc(s ? s.url : '')}"></label>
      <label class="f">Dirección que das a los clientes (opcional)<input name="publicUrl" maxlength="200" placeholder="https://emby.tudominio.com" value="${esc(s ? s.publicUrl || '' : '')}"></label>
      <label class="f">API key${s ? ' (vacío = mantener la actual)' : ''}<input name="apiKey" type="password" ${s ? '' : 'required'} autocomplete="off"></label>
      <p class="muted small">La API key se crea en Emby: Ajustes, Avanzado, Claves de API. Se guarda en este equipo y nunca se muestra en el navegador.${s ? '' : ' Después tendrás que elegir qué bibliotecas forman el contenido Básico y el 4K.'}</p>`,
    onSubmit: async (fd) => {
      const body = { name: fd.get('name'), url: fd.get('url'), publicUrl: fd.get('publicUrl'), apiKey: fd.get('apiKey') };
      if (s) {
        try { await api('PUT', `/api/servers/${s.id}`, body); }
        catch (e) { if (e.status !== 409 || !window.confirm(e.message + '\n\n¿Seguro que quieres cambiarlo? Las cuentas del panel están creadas en el servidor anterior.')) throw e; await api('PUT', `/api/servers/${s.id}`, { ...body, confirmOther: true }); }
      } else await api('POST', '/api/servers', body);
      return 'Conexión con Emby correcta';
    },
  });
}

function dPackages(s) {
  const block = (key, label) => {
    const p = (s.packages && s.packages[key]) || { all: false, folders: [] };
    return `<fieldset><legend>${label}</legend>
      <label class="check"><input type="checkbox" name="${key}_all"${p.all ? ' checked' : ''}> Todas, incluidas las que añadas más adelante</label>
      <div class="liblist${p.all ? ' off' : ''}" id="lib_${key}"><span class="muted small">Cargando bibliotecas…</span></div></fieldset>`;
  };
  openDlg({
    title: `Contenido de ${s.name}`, submit: 'Guardar contenido',
    body: `<p class="muted small" style="margin-bottom:14px">Marca qué bibliotecas ve una cuenta Básica y cuáles una cuenta 4K. Normalmente 4K incluye todo lo de Básico más las bibliotecas en 4K. Al guardar se aplica a las cuentas activas.</p>${block('basico', 'Básico')}<p class="err" id="pkgNote" style="max-width:none;margin:-6px 0 12px" hidden>Con «Todas» marcado en Básico, las cuentas básicas ven todo el servidor, también el 4K. En Emby verás encendido «Habilitar el acceso a todas las bibliotecas» y no aparecerá la lista. Para dar solo algunas, desmarca «Todas» y marca las que quieras.</p>${block('k4', '4K')}
      <p class="muted small">Al guardar, el panel vuelve a poner estas bibliotecas a todas las cuentas activas de este servidor.</p>`,
    onOpen: async () => {
      const note = () => { $('#pkgNote').hidden = !dlgForm.elements.basico_all.checked; };
      for (const key of ['basico', 'k4']) {
        const all = dlgForm.elements[key + '_all'];
        all.onchange = () => { $('#lib_' + key).classList.toggle('off', all.checked); note(); };
      }
      note();
      try {
        const { libraries } = await api('GET', `/api/servers/${s.id}/libraries`);
        for (const key of ['basico', 'k4']) {
          const picked = new Set(((s.packages && s.packages[key]) || {}).folders || []);
          $('#lib_' + key).innerHTML = libraries.length
            ? libraries.map((l) => `<label class="check"><input type="checkbox" name="${key}_folder" value="${esc(l.id)}"${picked.has(l.id) ? ' checked' : ''}> ${esc(l.name)}</label>`).join('')
            : '<span class="muted small">Este servidor no tiene bibliotecas.</span>';
        }
      } catch (e) { for (const key of ['basico', 'k4']) $('#lib_' + key).innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    },
    onSubmit: async (fd) => {
      if ($('#dlgForm .liblist .err')) throw new Error('No se pudieron cargar las bibliotecas. Cierra y vuelve a intentarlo.');
      const read = (key) => ({ all: fd.get(key + '_all') === 'on', folders: fd.getAll(key + '_folder') });
      const r = await api('PUT', `/api/servers/${s.id}/packages`, { basico: read('basico'), k4: read('k4') });
      return r.failed ? `Guardado, pero ${plural(r.failed, 'cuenta no se pudo', 'cuentas no se pudieron')} actualizar en Emby` : 'Contenido guardado';
    },
  });
}

function dImport(sid) {

  const load = async (serverId) => {
    const box = $('#impList');
    box.innerHTML = '<span class="muted small">Consultando Emby…</span>';
    try {
      const { users } = await api('GET', `/api/servers/${serverId}/emby-users`);
      box.innerHTML = users.length ? users.map((u) => `<label class="check"><input type="checkbox" name="embyId" value="${esc(u.id)}"${u.admin ? ' disabled' : ''}> ${esc(u.name)}${u.admin ? ' <span class="muted small">(administrador de Emby, no se gestiona)</span>' : u.disabled ? ' <span class="muted small">(desactivado)</span>' : ''}</label>`).join('')
        : '<span class="muted small">Todos los usuarios de Emby ya están en el panel.</span>';
    } catch (e) { box.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  };
  openDlg({
    title: 'Importar usuarios de Emby', submit: 'Importar marcados',
    body: `${serverSelect(first)}
      <fieldset><legend>Usuarios que aún no están en el panel</legend><div class="liblist" id="impList" style="border-top:0;margin-top:0;max-height:220px"></div></fieldset>

      </fieldset>`,
    onOpen: () => {
      const f = dlgForm, btn = $('button[type=submit]', f);
      const upd = () => {
        const pk = f.elements.pack && f.elements.pack.value !== '' ? packs[+f.elements.pack.value].credits : 0;
        const total = pk + (parseInt(f.elements.amount.value, 10) || 0);
        const after = u.credits + total;
        const short = mine && total > me().credits && !me().allowNegative;
        $('#cost', f).innerHTML = total === 0 ? `Saldo actual de ${esc(u.name)}: <b>${u.credits}</b>`
          : short ? `<span class="err" style="max-width:none">Son ${total} créditos y tú tienes ${me().credits}.</span>`
            : `${total > 0 ? 'Se le suman' : 'Se le restan'} <b>${Math.abs(total)}</b>. <span class="muted small">Tiene ${u.credits}, se queda con ${after}${u.creditPrice ? ' (' + eur(after * u.creditPrice) + ')' : ''}.</span>`;
        btn.disabled = total === 0 || short;
        // Cobro: solo cuando se suman créditos. El importe se rellena con su precio hasta que lo cambies a mano
        const box = $('#payBox', f); box.hidden = total <= 0;
        const gift = (f.querySelector('[name=pmethod]:checked') || {}).value === 'Sin cobro';
        $('.pamount', f).hidden = gift; $('.pstat', f).hidden = gift;
        const pa = f.elements.pamount; if (!pa.dataset.touched) pa.value = total > 0 && u.creditPrice ? (Math.round(total * u.creditPrice * 100) / 100) : (pa.value || '');
      };
      f.elements.pamount.addEventListener('input', () => { f.elements.pamount.dataset.touched = '1'; });
      f.oninput = upd; f.onchange = upd; upd();
    },
    onSubmit: async (fd) => {
      const pk = fd.get('pack') !== null && fd.get('pack') !== '' ? packs[+fd.get('pack')].credits : 0, tot = pk + (+fd.get('amount') || 0);
      const payment = tot > 0 ? { method: fd.get('pmethod'), amount: +fd.get('pamount') || 0, ref: fd.get('pref') || '', status: fd.get('pstatus') } : null;
      const r = await api('POST', `/api/users/${u.id}/credits`, { pack: fd.get('pack') || '', amount: fd.get('amount') === '' ? 0 : +fd.get('amount'), reason: fd.get('reason') || '', note: fd.get('note'), payment });
      return `${u.name} tiene ahora ${plural(r.credits, 'crédito', 'créditos')}`;
    },
  });
}

    act(() => api('PUT', '/api/templates', Object.fromEntries(TPL_ALL.map(([k]) => [k, fd.get(k)]))), 'Plantillas guardadas');
  }
  if (e.target.id === 'profileForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    act(async () => {
      await api('PUT', '/api/me', { name: fd.get('name'), email: fd.get('email') });
      if (fd.has('currency')) await api('PUT', '/api/settings', { currency: fd.get('currency'), creditPrice: +(fd.get('creditPrice') || 0) });
    }, 'Perfil guardado');
  }
  if (e.target.id === 'supportForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    act(() => api('PUT', '/api/settings', { support: { text: fd.get('text'), whatsapp: fd.get('whatsapp'), telegram: fd.get('telegram'), email: fd.get('email') } }), 'Contacto de soporte guardado');
  }
  if (e.target.id === 'timesForm') {
    e.preventDefault();
    const fd = new FormData(e.target), tab = e.target.dataset.tab, n = (k) => +fd.get(k);
    act(async () => {
      if (tab === 'con') {
        await api('PUT', '/api/alerts/config', { sessions: { on: fd.get('on') === 'on', stop: fd.get('stop') === 'on', grace: n('grace'), policy: fd.get('policy'), message: fd.get('message') } });
        await api('PUT', '/api/settings', { monitorSec: n('monitorSec'), liveSec: n('liveSec') });
        S.al.data = null;
      } else if (tab === 'lim') await api('PUT', '/api/settings', { warnDays: n('warnDays'), demoMax: n('demoMax') });
      else if (tab === 'pla') await api('PUT', '/api/settings', { graceDays: n('graceDays'), purgeDays: n('purgeDays'), demoPurgeDays: n('demoPurgeDays') });
      else await api('PUT', '/api/settings', { demoHours: String(fd.get('demoHours')).split(/[,;\s]+/).filter(Boolean).map(Number), demoMax: n('demoMax'), demoPurgeDays: n('demoPurgeDays') });
    }, 'Configuración guardada');
  }
  if (e.target.id === 'retForm') {
    e.preventDefault();
    const fd = new FormData(e.target), n = (k) => +fd.get(k);
    act(async () => {
      await api('PUT', '/api/settings', { retention: { logDays: n('logDays'), ledgerDays: n('ledgerDays'), backups: n('backups') } });
      await api('PUT', '/api/alerts/config', { transcode: { retention: n('alTrans') }, sessions: { retention: n('alSes') } });
      S.logs = null;
    }, 'Retención guardada');
  }
  if (e.target.id === 'tvForm') {
    e.preventDefault();
    const fd = new FormData(e.target), panel = canDo('system') && S.tv.scope === 'panel';
    const body = { on: fd.get('on') === 'on', list: fd.getAll('day').map(Number), every: +fd.get('every'), message: fd.get('message') || '' };
    if (panel) body.scope = 'panel'; else if (fd.get('use') === 'panel') body.use = 'panel';
    if (e.target.querySelector('.tv-form').disabled && !panel) { act(() => api('PUT', '/api/tv-notice', { use: 'panel' }), 'Usarás el aviso general'); S.tv.own = null; return; }
    act(() => api('PUT', '/api/tv-notice', body), 'Aviso guardado'); S.tv.own = null;
  }
  if (e.target.id === 'myTpls') {
    e.preventDefault();
    const fd = new FormData(e.target);
    act(() => api('PUT', '/api/my-templates', Object.fromEntries(TPL_ALL.map(([k]) => [k, fd.get(k) || '']))), 'Mensajes guardados');
  }
  if (e.target.id === 'pw') {
    e.preventDefault();
    const fd = new FormData(e.target);
    act(() => api('POST', '/api/my-password', { current: fd.get('current'), next: fd.get('next') }), 'Contraseña cambiada');
  }
});
// Refresca los datos cada minuto y al volver a la pestaña, salvo si estás escribiendo
const idle = () => S.d && !$('.combo-pop:not([hidden])') && !dlg.open && !document.hidden && !$('#app').hidden && !['ajustes', 'perfil', 'tiempos', 'retencion', 'apariencia', 'notifs', 'importar', 'avisotv', 'plantillas'].includes(S.view) && S.view !== 'nuevo' && S.view !== 'demonueva' && S.view !== 'plantillas' && S.view !== 'vendedor' && !(AL[S.view] && S.al.tab === 'cfg') && !['INPUT', 'SELECT', 'TEXTAREA'].includes((document.activeElement || {}).tagName);
document.addEventListener('visibilitychange', () => { if (idle()) reload().catch(() => {}); });
setInterval(() => { if (idle()) reload().catch(() => {}); }, 60000);

function bootFail(e) {
  bootLoading(false);
  document.body.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#061a2e;color:#eaf6fb;font:16px system-ui,sans-serif">
    <div style="max-width:440px;text-align:center"><h1 style="font-size:22px;margin:0 0 10px">No se pudo cargar el panel</h1>
    <p style="color:#fda4af;margin:0 0 14px">${esc(e && e.message)}</p>
    <p style="color:#a9c6d4;margin:0 0 18px">Si acabas de actualizar, espera un minuto: el panel se está reiniciando. Se vuelve a intentar solo en <b id="bootLeft">10</b> segundos.</p>
    <button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 22px;font-weight:700;color:#fff;background:linear-gradient(135deg,#fb923c,#ec4899,#8b5cf6);cursor:pointer">Reintentar ahora</button></div></div>`;
  let n = 10; const t = setInterval(() => { n--; const el = document.getElementById('bootLeft'); if (el) el.textContent = n; if (n <= 0) { clearInterval(t); location.reload(); } }, 1000);
}
// Solo se avisa de errores del propio panel: los de extensiones del navegador (MetaMask, traductores…) se ignoran
const ownErr = (src, stack) => { const t = String(stack || '') + ' ' + String(src || ''); if (/(chrome|moz|safari|edge)-extension:|webkit-masked-url|inpage\.js|contentscript/i.test(t)) return false; return !src || String(src).startsWith(location.origin); };
window.addEventListener('error', (e) => { if (S.d && e.message && ownErr(e.filename, e.error && e.error.stack)) toast('Error en el panel: ' + e.message, true); });
window.addEventListener('unhandledrejection', (e) => { const r = e.reason; if (!S.d || !r || !r.message) return; const st = String(r.stack || ''); if (!ownErr('', st) || (st && !st.includes(location.origin))) return; toast(r.message, true); });
boot().catch(bootFail);
</script>
</body>
