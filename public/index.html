<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concha</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('tema') === 'light' ? 'light' : 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }</script>
<style>
:root{
  /* Concha: la bahia al caer la tarde. Agua, arena y cielo */
  --bg:#0b1a23; --surface:#11242f; --raised:#183240; --line:#234656;
  --text:#e9f1f4; --muted:#8fa9b5;
  --brand:#5cc3e2; --on-brand:#05212c; --sand:#ecd29b;
  --ok:#5fcf96; --warn:#f0b545; --bad:#f0725f; --idle:#8a9a9f; --violet:#a9a6ff;
  --s1:#3987e5; --s2:#d95926;
  --r:10px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f6f8; --surface:#ffffff; --raised:#e9f0f3; --line:#d0dce2;
  --text:#11252e; --muted:#58717d;
  --brand:#0e7ea3; --on-brand:#ffffff; --sand:#b98a2b;
  --ok:#16824f; --warn:#9a6200; --bad:#c23d29; --idle:#6b7b82; --violet:#5b54c9;
  --s1:#2a78d6; --s2:#eb6834;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
h1{font-size:26px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
h2{font-size:18px;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Estructura */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 18px;font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--brand)}
.brand span{display:block;font-size:12.5px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 10px 12px;flex:1;overflow-y:auto}
.nav .h{font-size:12.5px;font-weight:600;color:var(--brand);padding:14px 12px 4px}
.nav .h.l1{padding:8px 12px 2px 22px;color:var(--muted)}
.nav button.l1{margin-left:10px}
.nav button.l1{padding-top:7px;padding-bottom:7px}
.nav button.l2{margin-left:22px;padding-top:5px;padding-bottom:5px;font-size:14px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:6px;padding:9px 12px;cursor:pointer;color:var(--muted)}
.nav button:hover{background:var(--raised);color:var(--text)}
.nav button[aria-current="page"]{background:var(--raised);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.nav .n{font-size:12px;background:var(--bg);border-radius:10px;padding:1px 8px;color:var(--muted)}
.sidefoot{padding:14px 20px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.sidefoot button{background:none;border:0;color:var(--muted);padding:0;margin-top:8px;cursor:pointer;text-decoration:underline}
main{padding:32px 36px 60px;min-width:0;max-width:1200px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{color:var(--muted);margin-top:4px;max-width:62ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* Botones y campos */
.btn{border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.danger{color:#2b0b06}
.btn.ghost{background:none}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:14px}
label.f>input,label.f>select,label.f>textarea,.inrow>input{display:block;width:100%;margin-top:5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--text)}
.inrow{display:flex;gap:8px;margin-top:5px}
.inrow>input{margin-top:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{display:flex;gap:8px;align-items:center;padding:4px 0;color:var(--text);font-size:14px}
fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 14px 12px;margin:0 0 14px}
legend{font-size:13px;color:var(--muted);padding:0 6px}
.liblist{max-height:170px;overflow:auto;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.liblist.off{opacity:.4;pointer-events:none}

/* Recorrido de una cuenta: la pieza central del resumen */
.flow{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stg{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;background:none;border:0;border-right:1px solid var(--line);padding:18px 22px 16px;cursor:pointer}
.stg:last-child{border-right:0}
.stg:hover{background:var(--raised)}
.stg b{display:block;font-size:40px;font-weight:650;line-height:1;letter-spacing:-.02em}
.stg span{display:block;margin-top:8px;font-weight:600}
.stg small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.stg::after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.stg:hover::after{background:var(--raised)}
.stg:last-child::after{display:none}
.stg.active b{color:var(--ok)} .stg.soon b{color:var(--warn)} .stg.expired b{color:var(--bad)} .stg.trash b{color:var(--idle)}
.flownote{color:var(--muted);font-size:13px;margin:10px 2px 30px}

/* Tablas y paneles */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.panel+.panel,.panel+h2,h2+.panel{margin-top:14px}
section+section{margin-top:34px}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .acts{justify-content:flex-end;flex-wrap:nowrap}
.name{font-weight:600}
.empty{padding:38px 24px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.active{color:var(--ok)} .badge.soon{color:var(--warn)} .badge.expired{color:var(--bad)} .badge.trash{color:var(--idle)}
.err{color:var(--bad);font-size:12.5px;margin-top:3px;max-width:44ch}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);border-radius:16px;padding:4px 13px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--raised);color:var(--text);border-color:var(--muted)}
.pad{padding:18px 20px}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line)}
.cal>div{background:var(--surface);min-height:92px;padding:6px 8px;font-size:12.5px;min-width:0}
.cal>.dow{min-height:0;color:var(--muted);font-weight:600;padding:8px}
.cal>.out{background:var(--bg)}
.cal .dn{color:var(--muted)}
.cal .today .dn{color:var(--brand);font-weight:700}
.cal button{display:block;width:100%;text-align:left;border:0;border-radius:4px;margin-top:3px;padding:2px 6px;font-size:12.5px;cursor:pointer;background:var(--raised);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal button.expired{box-shadow:inset 3px 0 0 var(--bad)} .cal button.soon{box-shadow:inset 3px 0 0 var(--warn)} .cal button.active{box-shadow:inset 3px 0 0 var(--ok)}

/* En directo */
.bar{height:4px;background:var(--bg);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}

/* Diálogo, avisos y acceso */
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(4,12,13,.72)}
dialog form{padding:22px 24px}
dialog h2{margin-bottom:16px}
.dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.derr{color:var(--bad);font-size:13.5px;margin-top:6px}
.preview{background:var(--bg);border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.facts{background:var(--bg);border-radius:6px;padding:6px 14px;margin:0 0 16px}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:6px;font-weight:600;max-width:90vw;z-index:50}
#toast.bad{background:var(--bad);color:#2b0b06}
#gate{min-height:100%;display:grid;place-items:center;padding:24px}
#gate form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px}
#gate .brand{padding:0 0 14px}
#gate p{color:var(--muted);margin-bottom:18px}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr 1fr}
  .stg:nth-child(2){border-right:0}
  .stg:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .stg::after{display:none}
  .row2{grid-template-columns:1fr}
  .cal>div{min-height:64px;padding:4px}
}

/* v2: planes, creditos y usuarios */
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1180px){.row4{grid-template-columns:1fr 1fr}}
.formpage h2{margin:0 0 16px}
.formpage h2.sep{margin-top:10px;padding-top:22px;border-top:1px solid var(--line)}
.formpage textarea{resize:vertical}
.formpage .dfoot{margin-top:6px}
.contact{font-size:13px;margin-top:2px}
.contact a{color:var(--brand);text-decoration:none}
.contact a:hover{text-decoration:underline}
.due{color:var(--warn);font-size:13px;margin-top:2px}
.audit li{margin:4px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--text)}
button.tile{cursor:pointer} button.tile:hover{background:var(--raised)}
.tile b{font-size:26px;font-weight:650;line-height:1.1;letter-spacing:-.01em}
.tile b small{font-size:14px;font-weight:400;color:var(--muted)}
.tile span{font-size:13px;color:var(--muted);margin-top:3px}
.tile.mine b,.tile.demo b{color:var(--brand)} .tile.active b{color:var(--ok)} .tile.soon b{color:var(--warn)} .tile.expired b{color:var(--bad)}
.tools select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:220px}
.combo{position:relative}
.combo-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:190px;max-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left}
.combo-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-btn::after{content:"";flex-shrink:0;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.combo-pop{position:absolute;z-index:35;top:calc(100% + 4px);left:0;width:min(300px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.combo-pop input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.combo-list{max-height:min(280px,38vh);overflow:auto;display:flex;flex-direction:column;gap:1px}
.combo-list button{text-align:left;background:none;border:0;border-radius:5px;padding:8px 10px;cursor:pointer}
.combo-list button:hover{background:var(--raised)}
.combo-list button[aria-selected="true"]{background:var(--raised);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.combo-list small{color:var(--muted);font-size:12.5px;margin-left:6px}
.combo-none{padding:8px 10px;color:var(--muted);font-size:13.5px}
.dirbtn{min-width:42px}
.expcols{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.expfmt{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.expfmt:hover{background:var(--raised)} .expfmt b{display:block} .expfmt small{color:var(--muted);font-size:13px}
.expfmt:disabled{opacity:.5;cursor:default}
#printArea{display:none}
@media print{
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font:10px/1.35 "Segoe UI",system-ui,sans-serif}
  #printArea h1{font-size:16px;margin:0 0 2px;color:#000} #printArea p{margin:0 0 8px;color:#444}
  #printArea table{width:100%;border-collapse:collapse} #printArea th,#printArea td{border:1px solid #999;padding:3px 5px;text-align:left;color:#000;font-size:9.5px;overflow-wrap:anywhere}
  #printArea th{background:#e6e6e6;font-weight:700} #printArea thead{display:table-header-group} #printArea tr{break-inside:avoid}
  @page{size:landscape;margin:10mm}
}
.tabbar,#shade{display:none}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--idle);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard.active{border-left-color:var(--ok)} .ccard.soon{border-left-color:var(--warn)} .ccard.expired{border-left-color:var(--bad)} .ccard.demo{border-left-color:var(--brand)}
.ccard header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ccard .who{min-width:0} .ccard .who .name{font-size:16px;overflow-wrap:anywhere}
.ccard .hd{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ccard .kv{font-size:13.5px;color:var(--muted)} .ccard .kv span{color:var(--text)}
.ccard .more{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.ccard .more .wide{grid-column:1/-1}
.ccard .acts{margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;border:1px solid var(--line);border-radius:5px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.tag.q{color:var(--warn);border-color:rgba(240,181,69,.4)}
.tag.left{font-weight:600} .tag.left.active{color:var(--ok)} .tag.left.soon{color:var(--warn)} .tag.left.expired{color:var(--bad)} .tag.left.demo{color:var(--brand)}
.linkbtn{background:none;border:0;padding:0 0 0 6px;color:var(--brand);cursor:pointer;font-size:13px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 2px 12px;font-size:13.5px}
.pager .acts{align-items:center}
.mlist{display:flex;flex-direction:column;gap:2px;margin:-4px -8px 0}
.mitem{text-align:left;background:none;border:0;border-radius:6px;padding:10px 12px;cursor:pointer}
.mitem:hover{background:var(--raised)} .mitem.sep{border-top:1px solid var(--line);border-radius:0 0 6px 6px;margin-top:4px}
.mitem.bad{color:var(--bad)} .mitem small{display:block;color:var(--muted);font-size:12.5px}
.bulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--raised);border:1px solid var(--brand);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.bulk b{margin-right:auto}
.selall{display:inline-flex;align-items:center;gap:8px;font-size:14px;margin:0 2px 12px;cursor:pointer}
.ccard .pick{width:18px;height:18px;margin:3px 2px 0 0;flex-shrink:0}
.ccard.picked{outline:2px solid var(--brand);outline-offset:-1px}
.vcards{display:flex;flex-direction:column;gap:10px}
.vcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:var(--r);padding:12px 16px}
.vcard.r-super,.vcard.r-admin{border-left-color:var(--violet)} .vcard.r-reseller{border-left-color:var(--ok)} .vcard.r-sub{border-left-color:var(--warn)}
.vcard.off{opacity:.65}
.vcard .vmain{flex:1;min-width:220px;display:flex;flex-direction:column;gap:5px}
.vcard .vrole{font-size:12.5px;font-weight:600}
.vcard.r-super .vrole,.vcard.r-admin .vrole{color:var(--violet)} .vcard.r-reseller .vrole{color:var(--ok)} .vcard.r-sub .vrole{color:var(--warn)}
.tag.cr{color:var(--ok);border-color:rgba(95,207,150,.4);font-weight:600} .tag.eur{color:var(--brand);border-color:rgba(69,196,209,.4)}
.kind{display:inline-block;font-size:12.5px;font-weight:600;border-radius:5px;padding:1px 8px;border:1px solid var(--line)}
.kind.credito{color:var(--ok)} .kind.asignacion{color:var(--violet)} .kind.renovacion,.kind.alta{color:var(--brand)} .kind.ajuste{color:var(--warn)}
.packrow{display:grid;grid-template-columns:1fr 130px;gap:10px;margin-bottom:8px}
.packrow input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.module{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:16px}
.module .state{font-weight:700;font-size:13px;border-radius:5px;padding:3px 10px;border:1px solid var(--line);color:var(--muted)}
.module .state.on{color:var(--ok);border-color:rgba(95,207,150,.5)}
.module .grow{flex:1;min-width:200px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px;margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--text);font-weight:600}
tr.unread td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.lvl{font-size:12.5px;font-weight:600;color:var(--bad)}
.hist{max-height:55vh;overflow:auto;margin:0;padding:0;list-style:none}
.hist li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px} .hist li:last-child{border-bottom:0}
.badge.demo{color:var(--brand)}
.cal button.demo{box-shadow:inset 3px 0 0 var(--brand)}
.sidefoot b{color:var(--text)}
.plus{color:var(--ok);font-weight:600} .minus{color:var(--bad);font-weight:600}
.bal{display:flex;align-items:baseline;gap:12px}
.bal b{font-size:56px;font-weight:650;line-height:1;letter-spacing:-.02em;color:var(--brand)}
.bal span{color:var(--muted)}
table.prices{width:auto}
table.prices th,table.prices td{padding:5px 14px 5px 0;border:0;font-size:13.5px}
table.prices input{width:92px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
@media (max-width:860px){.row3,.row4{grid-template-columns:1fr}}

/** Columnas apiladas: altas y renovaciones de cada uno de los ultimos 30 dias */
function activityChart(days) {
  if (!days.length) return '';
  // el ancho se toma del hueco real para que el texto no se agrande ni se encoja
  const W = Math.max(280, Math.min(1100, (($('#main') || {}).clientWidth || 760) - ((window.innerWidth || 1200) <= 860 ? 70 : 114))), H = W < 480 ? 160 : 200, L = 28, R = 6, T = 8, B = 22, pw = W - L - R, ph = H - T - B;
  const max = Math.max(1, ...days.map((d) => d.alta + d.renovacion));
  const step = Math.max(1, Math.ceil(max / 3)), top = step * Math.ceil(max / step);
  const y = (v) => T + ph - (v / top) * ph, band = pw / days.length, bw = Math.max(3, Math.min(24, band - (band < 14 ? 3 : 6))), every = W < 480 ? 10 : 5;
  const lab = (d) => { const [, m, dd] = d.split('-').map(Number); return `${dd} ${MES[m - 1]}`; };
  const seg = (x, v0, v1, cls, cap) => {
    const y1 = y(v1), y0 = y(v0) - (v0 > 0 ? 2 : 0), h = y0 - y1;
    if (h <= 0) return '';
    const r = cap ? Math.min(4, h, bw / 2) : 0;
    return `<path class="${cls}" d="M${x} ${y0}V${y1 + r}q0-${r} ${r}-${r}h${bw - 2 * r}q${r} 0 ${r} ${r}V${y0}z"/>`;
  };
  let grid = '', bars = '', hits = '', xl = '';
  for (let v = 0; v <= top; v += step) grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  days.forEach((d, k) => {
    const x = L + k * band + (band - bw) / 2, tot = d.alta + d.renovacion;
    bars += seg(x, 0, d.alta, 'a', !d.renovacion) + seg(x, d.alta, tot, 'b', true);
    hits += `<rect class="hit" tabindex="0" x="${L + k * band}" y="${T}" width="${band}" height="${ph}" data-tip="${lab(d.d)}|${d.alta}|${d.renovacion}" aria-label="${lab(d.d)}: ${plural(d.alta, 'alta', 'altas')}, ${plural(d.renovacion, 'renovación', 'renovaciones')}"/>`;
    if (k % every === every - 1) xl += `<text class="axis" x="${L + k * band + band / 2}" y="${H - 5}" text-anchor="middle">${lab(d.d)}</text>`;
  });
  const total = days.reduce((n, d) => n + d.alta + d.renovacion, 0);
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Cuentas nuevas</span><span><i style="background:var(--s2)"></i>Renovaciones</span><span style="margin-left:auto">Últimos 30 días${total ? '' : ': todavía sin altas ni renovaciones'}</span></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Cuentas nuevas y renovaciones por día, últimos 30 días">${grid}${bars}${xl}${hits}</svg><div class="tip" hidden></div></div>
    <details class="tbl"><summary>Ver como tabla</summary><table><thead><tr><th>Día</th><th>Cuentas nuevas</th><th>Renovaciones</th></tr></thead><tbody>${[...days].reverse().filter((d) => d.alta + d.renovacion).map((d) => `<tr><td>${lab(d.d)}</td><td>${d.alta}</td><td>${d.renovacion}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Sin actividad en estos 30 días.</td></tr>'}</tbody></table></details>`;
}

const SORTS = [['name', 'nombre'], ['email', 'email'], ['server', 'servidor'], ['quality', 'paquete'], ['owner', 'vendedor'], ['expiry', 'fin de suscripción'], ['seen', 'últ. conexión'], ['action', 'última acción'], ['created', 'fecha de creación']];
/** Comparador de la lista de clientes: los que no tienen dato van siempre al final */
function clientSorter() {
  const key = {
    name: (c) => c.panelName.toLowerCase(), email: (c) => (c.email || '').toLowerCase(), server: (c) => serverName(c.serverId).toLowerCase(),
    quality: (c) => (c.quality ? Q[c.quality] : '') + (c.screens || 0), owner: (c) => (userName(c.ownerId) || '').toLowerCase(),
    expiry: (c) => c.expiresAt || c.expires, seen: (c) => (S.seen && S.seen[c.id] && !String(S.seen[c.id]).startsWith('0001') ? S.seen[c.id] : ''),
    action: (c) => c.lastAction || c.createdAt || '', created: (c) => (c.createdAt || '') + String(c.id).padStart(9, '0'),
  }[S.sort] || ((c) => c.expires);
  return (x, y) => {
    const a = key(x), b = key(y);
    if (!a || !b) return (a ? -1 : b ? 1 : 0) || x.panelName.localeCompare(y.panelName);
    return (a < b ? -1 : a > b ? 1 : 0) * S.dir || x.panelName.localeCompare(y.panelName);
  };
}

function auditHtml() {

    return h + `<div class="panel"><div class="empty">${a.errors.length ? 'No se pudo comprobar.' : `Todo cuadra: ${plural(a.checked, 'cuenta revisada', 'cuentas revisadas')} y ninguna diferencia con Emby.`}</div></div>`;
  }
  const who = (r) => `<span class="name">${esc(r.panelName)}</span> <span class="muted small">${esc(r.embyName)}${S.d.servers.length > 1 ? ', ' + esc(r.server) : ''}${r.owner ? ', de ' + esc(r.owner) : ''}</span>`;
  if (a.mismatch.length) h += `<section><h2>Estado distinto en Emby (${a.mismatch.length})</h2><div class="panel pad audit"><p class="muted small">Alguien lo cambió a mano en Emby. Renovar o editar la cuenta desde el panel vuelve a aplicar su estado.</p><ul>${a.mismatch.map((r) => `<li>${who(r)}: ${esc(r.problems.join('; '))}.</li>`).join('')}</ul></div></section>`;
  if (a.notInEmby.length) h += `<section><h2>En el panel, pero borradas de Emby (${a.notInEmby.length})</h2><div class="panel pad audit"><p class="muted small">Ya no existen en el servidor. Dalas de baja y elimínalas desde la Papelera.</p><ul>${a.notInEmby.map((r) => `<li>${who(r)}</li>`).join('')}</ul></div></section>`;
  if (a.notInPanel.length) h += `<section><div class="head" style="margin-bottom:12px"><h2>En Emby, pero fuera del panel (${a.notInPanel.length})</h2><button class="btn" data-act="import">Importar de Emby</button></div><div class="panel pad audit"><p class="muted small">Usuarios que nadie controla: no caducan ni gastan créditos. Los administradores de Emby no se cuentan.</p><ul>${a.notInPanel.map((r) => `<li><span class="name">${esc(r.name)}</span>${S.d.servers.length > 1 ? ' <span class="muted small">' + esc(r.server) + '</span>' : ''}${r.disabled ? ' <span class="muted small">(desactivado)</span>' : ''}</li>`).join('')}</ul></div></section>`;
  return h;
}

async function loadAlerts() {

function alertRows(kind) {
  const a = S.al, def = AL[kind], q = a.q.trim().toLowerCase(), now = Date.now();
  const span = { d1: 86400000, d7: 7 * 86400000, d30: 30 * 86400000 }[a.period];
  const rows = a.data.alerts.filter((x) => (def.type ? x.type === def.type : (a.type === 'all' || x.type === a.type)) &&
    (!a.server || x.serverId === a.server) && (!a.owner || x.ownerId === a.owner) &&
    (a.read === 'all' || (a.read === 'unread') === !x.read) && (!span || now - Date.parse(x.ts) < span) &&
    (!q || [x.client, x.emby, x.device, x.item, x.reason].join(' ').toLowerCase().includes(q)));
  if (a.sort === 'old') rows.reverse();
  if (a.sort === 'client') rows.sort((p, r) => p.client.localeCompare(r.client));
  return rows;
}
function vAlertas(kind) {
  const def = AL[kind], a = S.al;
  if (!a.data) return head(def.title, def.sub) + '<div class="panel"><div class="empty">Cargando alertas…</div></div>';

  const now = Date.now();
  const tile = (n, label, cls = '') => `<div class="tile ${cls}"><b>${n}</b><span>${label}</span></div>`;

    : tile(all.length, 'Total') + tile(all.filter((x) => !x.read).length, 'Sin leer', 'soon') + tile(all.filter((x) => x.level === 'critica').length, 'Críticas', 'expired') + tile(all.filter((x) => x.type === 'sesiones').length, 'Sesiones excedidas');
  const module = cfg ? `<div class="module">

    </div>` : '';
  const tabs = def.type ? `<div class="tabs" role="tablist">${[['hist', 'Historial'], ...(staff() ? [['cfg', 'Configuración']] : []), ['rep', 'Reincidentes']].map(([k, t]) => `<button role="tab" data-act="al-tab" data-k="${k}" aria-selected="${a.tab === k}">${t}</button>`).join('')}</div>` : '';
  let body;
  if (def.type && a.tab === 'cfg' && staff() && cfg) {
    body = `<form id="alcfg" data-k="${def.key}" class="panel pad formpage" style="max-width:720px">
      <label class="check"><input type="checkbox" name="stop"${cfg.stop ? ' checked' : ''}> Detener la reproducción automáticamente (si no, solo se registra el aviso)</label>
      ${def.key === 'transcode' ? `<label class="check"><input type="checkbox" name="onlyVideo"${cfg.onlyVideo ? ' checked' : ''}> Actuar solo cuando se convierte el vídeo (ignorar si solo cambia el audio o los subtítulos)</label>` : ''}
      <label class="f" style="margin-top:14px">Mensaje que ve el usuario en pantalla al detenerle<textarea name="message" rows="3" maxlength="300">${esc(cfg.message)}</textarea></label>
      <label class="f" style="max-width:260px">Días que se guarda el historial<input type="number" name="retention" min="1" max="365" value="${cfg.retention}" required></label>
      <p class="muted small" style="margin-bottom:12px">${def.key === 'transcode' ? 'Solo se vigilan las cuentas creadas o importadas en el panel. Los administradores de Emby no se tocan.' : 'El límite es el número de pantallas de cada cuenta. Las cuentas importadas sin límite de pantallas no se vigilan. Al detener, se cortan las reproducciones que llevan menos tiempo.'} La comprobación se hace cada 30 segundos.</p>
      <div class="dfoot" style="justify-content:flex-start"><button class="btn primary" type="submit">Guardar configuración</button></div>
    </form>`;
  } else if (def.type && a.tab === 'rep') {
    const by = new Map();
    all.forEach((x) => { const r = by.get(x.clientId) || { n: 0, last: x.ts, x }; r.n++; if (x.ts > r.last) r.last = x.ts; by.set(x.clientId, r); });

      : '<div class="panel"><div class="empty">Nadie ha repetido todavía. Aquí aparecen las cuentas con dos o más detecciones.</div></div>';

function vCalendario() {
  const t = S.d.today;
  if (!S.cal) S.cal = t.slice(0, 7);
  const [y, m] = S.cal.split('-').map(Number);
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const offset = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7; // lunes primero
  const by = {};
  live().filter((c) => !c.demo).forEach((c) => { (by[c.expires] = by[c.expires] || []).push(c); });
  let cells = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map((x) => `<div class="dow">${x}</div>`).join('');
  for (let i = 0; i < offset; i++) cells += '<div class="out"></div>';
  for (let i = 1; i <= days; i++) {
    const ds = `${y}-${pad(m)}-${pad(i)}`;
    const list = (by[ds] || []).sort(byExpiry);
    cells += `<div class="${ds === t ? 'today' : ''}"><span class="dn">${i}</span>${list.map((c) => `<button class="${stage(c)}" data-act="renew" data-id="${c.id}" title="${esc(c.panelName)}: renovar">${esc(c.panelName)}</button>`).join('')}</div>`;
  }

/** Cada reseller seguido de sus subresellers */
function vendorTree(list) {
  const byName = (a, b) => a.name.localeCompare(b.name);
  const subs = list.filter((u) => u.role === 'sub');
  const out = [];
  list.filter((u) => u.role !== 'sub').sort((a, b) => RANK[a.role] - RANK[b.role] || byName(a, b)).forEach((u) => {
    out.push([u, 0]);
    subs.filter((x) => x.parentId === u.id).sort(byName).forEach((x) => out.push([x, 1]));
  });
  subs.filter((x) => !out.some(([u]) => u.id === x.id)).sort(byName).forEach((x) => out.push([x, 0]));
  return out;
}

function dUserTransfer(u) {

    title: `Transferir los clientes de ${u.name}`, submit: 'Transferir',
    body: `${ownerSelect(0)}<p class="muted small">Sus ${plural(ids.length, 'cuenta pasa', 'cuentas pasan')} al vendedor que elijas, incluidas las de la papelera. No se mueven créditos ni cambia nada en Emby.</p>`,

  });

      if (!pays()) lines.push(`<span class="muted small">Valor: ${plural(cost, 'crédito', 'créditos')}. Como administrador no se te descuentan.</span>`);
      else if (cost > me().credits) { ok = false; lines.push(`<span class="err" style="max-width:none">Cuesta ${plural(cost, 'crédito', 'créditos')} y tienes ${me().credits}. Pide una recarga antes de continuar.</span>`); }
      else lines.push(`Cuesta <b>${plural(cost, 'crédito', 'créditos')}</b>. <span class="muted small">Tienes ${me().credits}, te quedarán ${me().credits - cost}.</span>`);
    } else lines.push('Las demos son gratis. <span class="muted small">Al terminar se desactiva sola; puedes convertirla en cuenta cuando quieras.</span>');
    if (q !== 'custom' && srv && !srv.ready[q]) { ok = false; lines.push(`<span class="err" style="max-width:none">El contenido ${Q[q]} aún no está configurado en este servidor${canDo('packages') ? ' (Servidores, Contenido)' : '. Avisa al superadministrador'}.</span>`); }
    $('#cost', f).innerHTML = lines.join('<br>');
    btn.disabled = !ok;
  };
  f.onchange = upd; upd();
}
function genPassword() {
  const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(10)), (b) => abc[b % abc.length]).join('');
}

const bulkIds = () => (S.sel.size ? [...S.sel] : [...S.rowIds]);
const bulkScope = (ids) => (S.sel.size ? plural(ids.length, 'cuenta seleccionada', 'cuentas seleccionadas') : ids.length === 1 ? 'la cuenta de esta lista' : `las ${ids.length} cuentas de esta lista`);
/** Llama a una ruta en bloque en tandas de 500 y junta los resultados */
async function bulkCall(url, ids, extra) {
  const out = { moved: 0, skipped: 0, failed: [] };
  for (let k = 0; k < ids.length; k += 500) {
    const r = await api('POST', url, { ids: ids.slice(k, k + 500), ...extra });
    out.moved += r.moved; out.skipped += r.skipped; out.failed.push(...r.failed);
  }
  return out;
}
function bulkResult(r, what, one = 'cuenta transferida', many = 'cuentas transferidas', skipTxt = 'ya estaban ahí') {
  S.sel.clear();
  if (!r.failed.length) return `${plural(r.moved, one, many)}${r.skipped ? `, ${r.skipped} ${skipTxt}` : ''}`;
  setTimeout(() => showDlg(`${what}: ${r.moved} hechas, ${r.failed.length} sin hacer`, `<p class="muted small" style="margin-bottom:10px">Estas cuentas se han quedado como estaban:</p><ul class="hist">${r.failed.map((f) => `<li><span class="name">${esc(f.name)}</span> <span class="muted small">${esc(f.emby)}</span><div class="small err" style="max-width:none">${esc(f.error)}</div></li>`).join('')}</ul>`), 50);
  return '';
}

function dCredits(u) {
  const mine = pays(), neg = !mine || me().role === 'admin';
  const packs = S.d.settings.creditPacks || [];
  const reasons = ['Compra de créditos', 'Bonificación', 'Ajuste', 'Devolución', 'Penalización', 'Semanal', 'Mensual', 'Otro'];
  openDlg({
    title: `Asignar créditos a ${u.name}`, submit: mine ? 'Pasar créditos' : 'Asignar créditos',
    body: `<p class="muted small" style="margin:-8px 0 14px">Selecciona un paquete, escribe una cantidad, o las dos cosas.${mine ? ` Salen de tu saldo: tienes ${me().credits}.` : ''}</p>
      ${packs.length ? `<label class="f">Paquete<select name="pack"><option value="">Sin paquete</option>${packs.map((p, k) => `<option value="${k}">${esc(p.name)} (${plural(p.credits, 'crédito', 'créditos')})</option>`).join('')}</select></label>` : ''}
      <label class="f">Créditos adicionales${neg ? (mine ? ' (número negativo para que te los devuelva)' : ' (número negativo para restar)') : ''}<input type="number" name="amount" step="1" ${neg ? 'min="-100000"' : 'min="0"'} max="100000" placeholder="0"></label>
      ${mine ? '' : `<label class="f">Motivo (opcional)<select name="reason"><option value="">Sin motivo</option>${reasons.map((r) => `<option>${r}</option>`).join('')}</select></label>`}
      <label class="f">Nota (opcional)<input name="note" maxlength="120" placeholder="Pago por Bizum, transferencia…"></label>
      <p class="preview" id="cost"></p>`,
    onOpen: () => {
      const f = dlgForm, btn = $('button[type=submit]', f);
      const upd = () => {
        const pk = f.elements.pack && f.elements.pack.value !== '' ? packs[+f.elements.pack.value].credits : 0;
        const total = pk + (parseInt(f.elements.amount.value, 10) || 0);
        const after = u.credits + total;
        const short = mine && total > me().credits && !me().allowNegative;
        $('#cost', f).innerHTML = total === 0 ? `Saldo actual de ${esc(u.name)}: <b>${u.credits}</b>`
          : short ? `<span class="err" style="max-width:none">Son ${total} créditos y tú tienes ${me().credits}.</span>`
            : `${total > 0 ? 'Se le suman' : 'Se le restan'} <b>${Math.abs(total)}</b>. <span class="muted small">Tiene ${u.credits}, se queda con ${after}${u.creditPrice ? ' (' + eur(after * u.creditPrice) + ')' : ''}.</span>`;
        btn.disabled = total === 0 || short;
      };
      f.oninput = upd; f.onchange = upd; upd();
    },
    onSubmit: async (fd) => {
      const r = await api('POST', `/api/users/${u.id}/credits`, { pack: fd.get('pack') || '', amount: fd.get('amount') === '' ? 0 : +fd.get('amount'), reason: fd.get('reason') || '', note: fd.get('note') });
      return `${u.name} tiene ahora ${plural(r.credits, 'crédito', 'créditos')}`;
    },
  });
}

  const alSel = { aType: 'type', aRead: 'read', aPeriod: 'period', aSort: 'sort' }[e.target.id];
  if (alSel) { S.al[alSel] = e.target.value; S.al.page = 1; render(); }
  if (e.target.id === 'aServer') { S.al.server = +e.target.value || 0; S.al.page = 1; render(); }
  if (e.target.id === 'aOwner') { S.al.owner = +e.target.value || 0; S.al.page = 1; render(); }
  if (e.target.name === 'expcol') { e.target.checked ? S.expCols.add(e.target.value) : S.expCols.delete(e.target.value); expCount(); }

    rd.readAsDataURL(file);

  if (e.target.id === 'fSort') { S.sort = e.target.value; S.page = 1; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeCombo(); hideTip(); } });
document.addEventListener('pointerover', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); else hideTip(); });
document.addEventListener('focusin', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
document.addEventListener('focusout', (e) => { if (e.target.closest && e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('click', (e) => {
  if (!e.target.closest('.combo')) closeCombo();
  const nav = e.target.closest('[data-view]');
  if (nav) {
    closeMenu();
    if ((nav.dataset.view === 'nuevo' || nav.dataset.view === 'demonueva') && !S.d.servers.length) { needServer(() => {}); return; }
    S.view = nav.dataset.view;
    if (nav.dataset.filter) { S.filter = nav.dataset.filter; S.q = ''; S.fOwner = 0; S.fServer = 0; S.page = 1; }
    if (/^mov/.test(S.view)) S.logF = 'all';
    if (AL[S.view]) { Object.assign(S.al, { data: null, tab: 'hist', q: '', server: 0, owner: 0, period: 'all', type: 'all', read: 'all', sort: 'new', page: 1 }); }
    if (S.view === 'auditoria') S.audit = null;
    if (S.view === 'monitor') S.mon.data = null;
    render(); window.scrollTo(0, 0); return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = +el.dataset.id;
  if (a === 'navgrp') { // plegar o desplegar un grupo del menu, sin cerrarlo en el movil
    const k = el.dataset.k; el.getAttribute('aria-expanded') === 'true' ? NAV_OPEN.delete(k) : NAV_OPEN.add(k);

    if (el.getAttribute('aria-expanded') === 'true' && el.nextElementSibling && el.nextElementSibling.querySelector('[aria-current]')) return; // el grupo de la seccion actual no se pliega
    render(); return;

  if (a === 'mon-k') { const k = el.dataset.k, f = S.mon; if (k === 'all') Object.assign(f, { st: 'all', tr: 'all', kind: 'all' }); else if (k === 'play' || k === 'pause') f.st = f.st === k ? 'all' : k; else if (k === 'tr') f.tr = f.tr === 'yes' ? 'all' : 'yes'; else f.kind = f.kind === k ? 'all' : k; monPaint(); return; }
  if (a === 'mon-srv') { S.mon.srv = S.mon.srv === id ? 0 : id; monPaint(); return; }
  if (a === 'mon-stop') { monStop(el); return; }
  if (a === 'mon-msg') { monMsg(el); return; }
  if (a === 'mon-tpl') { const t = el.closest('form').elements.text; t.value = el.dataset.m; t.focus(); return; }
  if (a === 'gate-cap') { newCaptcha(); $('#gateForm').elements.captcha.focus(); return; }
  if (a === 'gate-eye') { const i = $('#gateForm').elements.password, show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.innerHTML = ic(show ? 'lock' : 'eye'); el.setAttribute('aria-label', show ? 'Ocultar la contraseña' : 'Mostrar la contraseña'); return; }
  if (a === 'gate-help') { el.nextElementSibling.hidden = !el.nextElementSibling.hidden; return; }
  if (a === 'theme') { applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); return; }
  if (a === 'menu') { const open = !$('.side').classList.contains('open'); $('.side').classList.toggle('open', open); $('#shade').classList.toggle('open', open); return; }
  closeMenu();
  const c = id ? S.d.clients.find((x) => x.id === id) : null;
  const srv = id ? S.d.servers.find((x) => x.id === id) : null;
  const usr = id ? S.d.users.find((x) => x.id === id) : null;
  switch (a) {
    case 'close': dlg.close(); break;
    case 'gen': {
      const kind = el.dataset.kind || 'password', inp = el.closest('form').elements[kind];
      if (kind === 'email') { // nombre de Emby + el dominio del panel; si aun no hay nombre, se genera uno
        const f = el.closest('form'), n = f.elements.embyName;

        const local = String(n ? n.value : '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9._-]+/g, '.').replace(/^[.]+|[.]+$/g, '') || 'cliente.' + genPassword().slice(0, 5);
        let host = ''; try { host = new URL(panelUrl()).hostname; } catch (x) { /* sin direccion del panel */ }
        inp.value = local + '@' + (/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(host) && !/^\d+(\.\d+){3}$/.test(host) ? host.replace(/^(www|panel)\./, '') : 'cliente.local');
        break;

      break;
    }
    case 'new': needServer(() => { S.view = 'nuevo'; render(); window.scrollTo(0, 0); }); break;
    case 'paid': if (c) act(() => api('POST', `/api/clients/${c.id}/paid`, {}), 'Cobro registrado'); break;
    case 'audit': loadAudit(); break;
    case 'demo': needServer(() => { S.view = 'demonueva'; render(); window.scrollTo(0, 0); }); break;

    case 'delete': if (c) dConfirm(`Eliminar a ${c.panelName}`, `El usuario <b>${esc(c.embyName)}</b> se borra de Emby junto con su historial y su progreso. No se puede deshacer.`,
      'Eliminar para siempre', () => api('DELETE', `/api/clients/${c.id}`), 'Cuenta eliminada'); break;
    case 'goto': S.view = el.dataset.filter === 'trash' ? 'papelera' : 'cuentas'; if (el.dataset.filter !== 'trash') S.filter = el.dataset.filter; S.q = ''; render(); break;
    case 'filter': S.filter = el.dataset.filter; S.page = 1; render(); break;
    case 'logf': S.logF = el.dataset.v; render(); break;
    case 'mine': S.filter = 'all'; S.fOwner = me().id; S.page = 1; render(); break;
    case 'cal': { const step = +el.dataset.step; S.cal = step === 0 ? S.d.today.slice(0, 7) : addMonths(S.cal + '-01', step).slice(0, 7); render(); break; }
    case 'run': act(() => api('POST', '/api/run', {}), 'Revisión hecha'); break;
    case 'server-new': dServer(); break;
    case 'server-edit': if (srv) dServer(srv); break;
    case 'server-pkg': if (srv) dPackages(srv); break;
    case 'server-test': if (srv) api('GET', `/api/servers/${srv.id}/test`).then((r) => toast(`Conectado a ${r.name} (Emby ${r.version})`)).catch((x) => toast(x.message, true)); break;
    case 'server-del': if (srv) dConfirm(`Quitar ${srv.name}`, 'El servidor se quita del panel. En Emby no se toca nada.', 'Quitar servidor', () => api('DELETE', `/api/servers/${srv.id}`), 'Servidor quitado'); break;
    case 'user-new': if (dlg.open) dlg.close(); S.vendorId = 0; S.view = 'vendedor'; render(); window.scrollTo(0, 0); break;
    case 'user-edit': if (usr && usr.role === 'admin') dAdmin(usr); else if (usr) { if (dlg.open) dlg.close(); S.vendorId = usr.id; S.view = 'vendedor'; render(); window.scrollTo(0, 0); } break;
    case 'user-info': if (usr) dVendorMsg(usr, ''); break;
    case 'ven-cfg': if (usr) dVenCfg(usr); break;
    case 'user-stats': if (usr) dUserStats(usr); break;
    case 'user-ledger': if (usr) dLedger(usr); break;
    case 'user-more': if (usr) dUserMore(usr); break;
    case 'adm-tab': S.admTab = el.dataset.k; render(); break;
    case 'tm-tab': S.tmTab = el.dataset.k; render(); break;
    case 'tile-style': act(() => api('PUT', '/api/tiles', { tiles: el.dataset.k }), 'Estilo de tarjetas guardado'); break;
    case 'theme-set': applyTheme(el.dataset.k); render(); break;
    case 'lg-reload': S.logs = null; render(); break;
    case 'lg-more': S.lg.n += 300; render(); break;
    case 'imp-tab': S.imp.tab = el.dataset.k; render(); break;
    case 'imp-parse': impParse(); break;
    case 'imp-reset': S.imp = { tab: 'uni', rows: null, results: null }; render(); break;
    case 'imp-check': impRun(true); break;
    case 'imp-go': impRun(false); break;
    case 'adm-new': dAdmin(null); break;
    case 'adm-perms': if (usr) dPerms(usr); break;
    case 'adm-link': if (usr) dXtreme(usr); break;
    case 'adm-unlink': if (usr) { dlg.close(); act(() => api('PUT', `/api/users/${usr.id}`, { xtreme: null }), 'Panel desvinculado'); } break;
    case 'adm-tech': if (usr) act(() => api('PUT', `/api/users/${usr.id}`, { tech: !usr.tech }), usr.tech ? `${usr.name} ya no es técnico` : `${usr.name} marcado como técnico`); break;
    case 'adm-on': if (usr) act(() => api('PUT', `/api/users/${usr.id}`, { disabled: false }), 'Administrador restaurado'); break;
    case 'adm-off': if (usr) dConfirm(`Eliminar a ${usr.name}`, 'Deja de poder entrar al panel y pasa a la pestaña «Eliminados». Desde ahí puedes restaurarlo o borrarlo para siempre.', 'Eliminar administrador', () => api('PUT', `/api/users/${usr.id}`, { disabled: true }), 'Administrador eliminado'); break;
    case 'user-transfer': if (usr) dUserTransfer(usr); break;
    case 'user-clients': if (usr) { if (dlg.open) dlg.close(); S.view = 'cuentas'; S.filter = 'all'; S.q = ''; S.fServer = 0; S.fOwner = usr.id; S.page = 1; render(); window.scrollTo(0, 0); } break;
    case 'user-toggle': if (usr) { if (dlg.open) dlg.close(); act(() => api('PUT', `/api/users/${usr.id}`, { disabled: !usr.disabled }), usr.disabled ? 'Vendedor activado' : 'Vendedor desactivado'); } break;
    case 'user-credits': if (usr) dCredits(usr); break;
    case 'user-del': if (usr) dConfirm(`Eliminar a ${usr.name}`, `Se borra su acceso al panel${usr.credits ? ` y se pierden sus ${plural(usr.credits, 'crédito', 'créditos')}` : ''}. Solo se puede si ya no tiene cuentas.`, 'Eliminar usuario', () => api('DELETE', `/api/users/${usr.id}`), 'Usuario eliminado'); break;
    case 'logout': api('POST', '/api/logout', {}).then(() => showGate(false)); break;
  }
});
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'vq') { // filtra la lista de vendedores sin repintar la pagina
    const t = e.target.value.trim().toLowerCase(), list = e.target.nextElementSibling;
    let n = 0;
    list.querySelectorAll('[data-t]').forEach((b) => { b.hidden = !!t && !b.dataset.t.includes(t); if (!b.hidden) n++; });
    $('.combo-none', list).hidden = n > 0;
    return;
  }
  if (id === 'monQ') { S.mon.q = e.target.value; monPaint(); return; }
  if (id === 'admq') S.admQ = e.target.value;
  if (id === 'lgq') { S.lg.q = e.target.value; S.lg.n = 200; }
  if (id !== 'q' && id !== 'uq' && id !== 'aq' && id !== 'admq' && id !== 'lgq') return;
  if (id === 'q') { S.q = e.target.value; S.page = 1; } else if (id === 'aq') { S.al.q = e.target.value; S.al.page = 1; } else if (id === 'uq') S.uq = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const q = $('#' + id); q.focus(); q.setSelectionRange(pos, pos);
});
document.addEventListener('submit', (e) => {
  if (e.target.id === 'rules') {
    e.preventDefault();
    const fd = new FormData(e.target);
    const prices = {};
    MONTH_OPTS.forEach(([m]) => { prices[m] = {}; SCREEN_OPTS.forEach(([s]) => { prices[m][s] = +fd.get(`p_${m}_${s}`); }); });
    act(() => api('PUT', '/api/settings', { warnDays: +fd.get('warnDays'), graceDays: +fd.get('graceDays'), purgeDays: +fd.get('purgeDays'), demoMax: +fd.get('demoMax'), prices }), 'Precios y reglas guardados');
  }
  if (e.target.id === 'newClient') {
    e.preventDefault();
    const f = e.target, fd = new FormData(f), btn = $('button[type=submit]', f), demo = !!f.dataset.demo;
    btn.disabled = true;
    const common = {
      serverId: +fd.get('serverId'), embyName: fd.get('embyName'), panelName: fd.get('panelName'), password: fd.get('password'),
      email: fd.get('email'), telegram: fd.get('telegram'), whatsapp: fd.get('whatsapp'), signal: fd.get('signal'), note: fd.get('note'), quality: fd.get('quality'),
    };
    (demo ? api('POST', '/api/demos', { ...common, hours: +fd.get('hours') })
      : api('POST', '/api/clients', { ...common, months: +fd.get('months'), screens: +fd.get('screens'), paid: fd.get('paid') === '1', ...(fd.get('ownerId') ? { ownerId: +fd.get('ownerId') } : {}) }))
      .then(async (r) => {
        S.view = 'cuentas'; S.filter = demo ? 'demo' : 'all'; S.q = ''; S.fOwner = 0; S.fServer = 0;
        await reload(); window.scrollTo(0, 0); toast(demo ? 'Demo creada en Emby' : 'Cliente creado en Emby');
        const created = S.d.clients.find((x) => x.id === r.id);
        if (created) dMessage(created, common.password, demo ? 'demo' : 'created');
      })
      .catch((x) => { toast(x.message, true); btn.disabled = false; });
  }
  if (e.target.id === 'vendorForm') {
    e.preventDefault();
    const f = e.target, fd = new FormData(f), btn = $('button[type=submit]', f), editing = S.vendorId;
    const role = fd.get('role') || 'sub';
    const body = { name: fd.get('name') };
    if (fd.get('password')) body.password = fd.get('password');
    if (staff()) {
      if (f.elements.parentId && fd.get('parentId') && (editing ? true : role === 'sub')) body.parentId = +fd.get('parentId');
      Object.assign(body, { creditPrice: +(fd.get('creditPrice') || 0), allowNegative: fd.get('allowNegative') === 'on', allowDemos: fd.get('allowDemos') === 'on', serverIds: fd.getAll('srv').map(Number) });
    }
    if (editing) body.disabled = fd.get('disabled') === 'on';
    else { body.username = fd.get('username'); body.role = role; }
    if (!editing && staff() && role === 'sub' && !body.parentId) { toast('Crea primero un reseller: cada subreseller depende de uno.', true); return; }
    btn.disabled = true;
    (editing ? api('PUT', `/api/users/${editing}`, body) : api('POST', '/api/users', body))
      .then(async () => {
        S.view = 'equipo'; await reload(); window.scrollTo(0, 0); toast(editing ? 'Perfil guardado' : 'Vendedor creado');
        // con la contraseña recien puesta se puede dar el mensaje completo
        const made = editing ? S.d.users.find((x) => x.id === editing) : S.d.users.find((x) => x.username === String(body.username).trim().toLowerCase());
        if (made && body.password) dVendorMsg(made, body.password);
      })
      .catch((x) => { toast(x.message, true); btn.disabled = false; });
  }
  if (e.target.id === 'packs') {
    e.preventDefault();
    const fd = new FormData(e.target), names = fd.getAll('pn'), creds = fd.getAll('pc');
    act(() => api('PUT', '/api/credit-packs', { packs: names.map((n, k) => ({ name: n.trim(), credits: +creds[k] || 0 })).filter((p) => p.name || p.credits) }), 'Paquetes de créditos guardados');
  }
  if (e.target.id === 'alcfg') {
    e.preventDefault();
    const fd = new FormData(e.target), k = e.target.dataset.k;
    api('PUT', '/api/alerts/config', { [k]: { stop: fd.get('stop') === 'on', onlyVideo: fd.get('onlyVideo') === 'on', message: fd.get('message'), retention: +fd.get('retention') } })
      .then(async () => { await loadAlerts(); render(); toast('Configuración guardada'); }).catch((x) => toast(x.message, true));
  }
  if (e.target.id === 'noticeForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    act(() => api('PUT', '/api/notices', { screen: { on: fd.get('screenOn') === 'on', days: +fd.get('screenDays'), message: fd.get('screenMsg') }, chat: { days: +fd.get('chatDays') }, telegram: { on: fd.get('tgOn') === 'on', token: fd.get('tgToken') } }), 'Avisos guardados');
  }
  if (e.target.id === 'brandForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    act(() => api('PUT', '/api/brand', { url: fd.get('url'), name: fd.get('name'), color: fd.get('custom') === 'on' ? fd.get('color') : '', logo: fd.get('logo') }), 'Marca guardada');
  }
  if (e.target.id === 'tpls') {
    e.preventDefault();
    const fd = new FormData(e.target);
    act(() => api('PUT', '/api/templates', Object.fromEntries(TPL_ALL.map(([k]) => [k, fd.get(k)]))), 'Plantillas guardadas');
  }
  if (e.target.id === 'profileForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    act(async () => {
      await api('PUT', '/api/me', { name: fd.get('name'), email: fd.get('email') });
      if (fd.has('currency')) await api('PUT', '/api/settings', { currency: fd.get('currency'), creditPrice: +(fd.get('creditPrice') || 0) });
    }, 'Perfil guardado');
  }
  if (e.target.id === 'supportForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    act(() => api('PUT', '/api/settings', { support: { text: fd.get('text'), whatsapp: fd.get('whatsapp'), telegram: fd.get('telegram'), email: fd.get('email') } }), 'Contacto de soporte guardado');
  }
  if (e.target.id === 'timesForm') {
    e.preventDefault();
    const fd = new FormData(e.target), tab = e.target.dataset.tab, n = (k) => +fd.get(k);
    act(async () => {
      if (tab === 'con') {
        await api('PUT', '/api/alerts/config', { sessions: { on: fd.get('on') === 'on', stop: fd.get('stop') === 'on', grace: n('grace'), policy: fd.get('policy'), message: fd.get('message') } });
        await api('PUT', '/api/settings', { monitorSec: n('monitorSec'), liveSec: n('liveSec') });
        S.al.data = null;
      } else if (tab === 'lim') await api('PUT', '/api/settings', { warnDays: n('warnDays'), demoMax: n('demoMax') });
      else if (tab === 'pla') await api('PUT', '/api/settings', { graceDays: n('graceDays'), purgeDays: n('purgeDays'), demoPurgeDays: n('demoPurgeDays') });
      else await api('PUT', '/api/settings', { demoHours: String(fd.get('demoHours')).split(/[,;\s]+/).filter(Boolean).map(Number), demoMax: n('demoMax'), demoPurgeDays: n('demoPurgeDays') });
    }, 'Configuración guardada');
  }
  if (e.target.id === 'retForm') {
    e.preventDefault();
    const fd = new FormData(e.target), n = (k) => +fd.get(k);
    act(async () => {
      await api('PUT', '/api/settings', { retention: { logDays: n('logDays'), ledgerDays: n('ledgerDays'), backups: n('backups') } });
      await api('PUT', '/api/alerts/config', { transcode: { retention: n('alTrans') }, sessions: { retention: n('alSes') } });
      S.logs = null;
    }, 'Retención guardada');
  }
  if (e.target.id === 'pw') {
    e.preventDefault();
    const fd = new FormData(e.target);
    act(() => api('POST', '/api/my-password', { current: fd.get('current'), next: fd.get('next') }), 'Contraseña cambiada');
  }
});
// Refresca los datos cada minuto y al volver a la pestaña, salvo si estás escribiendo
const idle = () => S.d && !$('.combo-pop:not([hidden])') && !dlg.open && !document.hidden && !$('#app').hidden && !['ajustes', 'perfil', 'tiempos', 'retencion', 'apariencia', 'notifs', 'importar'].includes(S.view) && S.view !== 'nuevo' && S.view !== 'demonueva' && S.view !== 'plantillas' && S.view !== 'vendedor' && !(AL[S.view] && S.al.tab === 'cfg') && !['INPUT', 'SELECT', 'TEXTAREA'].includes((document.activeElement || {}).tagName);
document.addEventListener('visibilitychange', () => { if (idle()) reload().catch(() => {}); });
setInterval(() => { if (idle()) reload().catch(() => {}); }, 60000);

function bootFail(e) {
  document.body.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#061a2e;color:#eaf6fb;font:16px system-ui,sans-serif">
    <div style="max-width:440px;text-align:center"><h1 style="font-size:22px;margin:0 0 10px">No se pudo cargar el panel</h1>
    <p style="color:#fda4af;margin:0 0 14px">${esc(e && e.message)}</p>
    <p style="color:#a9c6d4;margin:0 0 18px">Si acabas de actualizar, espera un minuto: el panel se está reiniciando. Se vuelve a intentar solo en <b id="bootLeft">10</b> segundos.</p>
    <button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 22px;font-weight:700;color:#fff;background:linear-gradient(135deg,#fb923c,#ec4899,#8b5cf6);cursor:pointer">Reintentar ahora</button></div></div>`;
  let n = 10; const t = setInterval(() => { n--; const el = document.getElementById('bootLeft'); if (el) el.textContent = n; if (n <= 0) { clearInterval(t); location.reload(); } }, 1000);
}
window.addEventListener('error', (e) => { if (S.d && e.message) toast('Error en el panel: ' + e.message, true); });
window.addEventListener('unhandledrejection', (e) => { if (S.d && e.reason && e.reason.message) toast(e.reason.message, true); });
boot().catch(bootFail);
</script>
